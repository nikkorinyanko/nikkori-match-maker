                                                                                            type="radio" 
                                                                                            name="accordionGenderMode"
                                                                                            checked={genderMode === 'balance'} 
                                                                                            onChange={() => setGenderMode('balance')} 
                                                                                            className="accent-emerald-500" 
                                                                                        />
                                                                                        <span className="text-sm font-bold text-slate-600">男女バランス均等</span>
                                                                                    </label>
                                                                                    <label className="flex items-center space-x-2 py-0.5 cursor-pointer">
                                                                                        <input 
                                                                                            type="radio" 
                                                                                            name="accordionGenderMode"
                                                                                            checked={genderMode === 'consider'} 
                                                                                            onChange={() => setGenderMode('consider')} 
                                                                                            className="accent-emerald-500" 
                                                                                        />
                                                                                        <span className="text-sm font-bold text-slate-600">男女バランスやや考慮</span>
                                                                                    </label>
                                                                                    <label ref={genderAccordionBottomRef} className="flex items-center space-x-2 py-0.5 cursor-pointer">
                                                                                        <input 
                                                                                            type="radio" 
                                                                                            name="accordionGenderMode"
                                                                                            checked={genderMode === 'none'} 
                                                                                            onChange={() => setGenderMode('none')} 
                                                                                            className="accent-emerald-500" 
                                                                                        />
                                                                                        <span className="text-sm font-bold text-slate-600">男女バランス考慮なし</span>
                                                                                    </label>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    ) : (
                                                                        <div className="py-1.5 px-3">
                                                                            {PRIORITY_LABELS[key]}
                                                                        </div>
                                                                    )}
                                                                </div>

                                                                <div className="flex space-x-1 shrink-0 h-7 items-center">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => movePriority(index, -1)}
                                                                        disabled={index === 0}
                                                                        className="w-6 h-6 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-[10px] font-bold text-slate-500 hover:text-emerald-600 active:scale-95 disabled:opacity-30 transition-all shadow-sm"
                                                                        title="上に移動"
                                                                    >
                                                                        ▲
                                                                    </button>
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => movePriority(index, 1)}
                                                                        disabled={index === priorityOrder.length - 1}
                                                                        className="w-6 h-6 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-[10px] font-bold text-slate-500 hover:text-emerald-600 active:scale-95 disabled:opacity-30 transition-all shadow-sm"
                                                                        title="下に移動"
                                                                    >
                                                                        ▼
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="pt-1 space-y-1.5">
                                    <div className="flex space-x-2">
                                        <button
                                            type="button"
                                            onClick={handleCreateMatchTable}
                                            className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-2 rounded-xl shadow-sm text-center flex items-center justify-center transition-all active:scale-[0.98] text-sm"
                                        >
                                            対戦表を新規作成する
                                        </button>
                                        
                                        {matchList.length > 0 && (
                                            <button
                                                type="button"
                                                onClick={handleOpenContinueModal}
                                                className="w-20 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3.5 px-1 rounded-xl shadow-sm text-center flex items-center justify-center transition-all active:scale-[0.98] text-sm leading-none"
                                            >
                                                変更する
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <div ref={bottomRef} />
                            </div>
                        )}

                        {}
                        {page === 'match' && (
                            <div className="space-y-3">
                                <div id="match-table-capture-area" className="bg-white px-3 py-3 border border-slate-200 rounded-xl shadow-sm">
                                    <div className="flex justify-between items-end border-b-2 border-slate-800 pb-1 mb-1">
                                        <h2 className="font-bold text-base leading-[1.3] text-slate-800 overflow-visible pr-2 capture-safe-text">
                                            {groupName || "（名称未設定のグループ）"}
                                        </h2>
                                        <span className="text-[10px] text-slate-500 whitespace-nowrap font-bold capture-safe-text">
                                            {dateStr}
                                        </span>
                                    </div>

                                    <div className="flex flex-col">
                                        {currentMatches.map((m, index) => {
                                            const matchNum = matchPage * 10 + index + 1;
                                            
                                            const p1 = getMemberName(m.t1[0]);
                                            const p2 = getMemberName(m.t1[1]);
                                            const p3 = getMemberName(m.t2[0]);
                                            const p4 = getMemberName(m.t2[1]);
                                            const absNames = m.absentees.map(id => getMemberName(id));

                                            return (
                                                <div key={m.id} className="relative">
                                                    {lastBoundaryIndex === matchNum - 1 && lastBoundaryIndex > 0 && (
                                                        <div className="border-t-2 border-dashed border-black my-1 w-full"></div>
                                                    )}
                                                    <div className="border-b border-slate-200 py-1.5 flex flex-col justify-center relative transition-colors">
                                                        <div className="flex items-center mb-1 w-full pr-2">
                                                            <span className="text-xs font-extrabold text-slate-700 w-16 shrink-0 capture-safe-text">
                                                                第{matchNum}試合
                                                            </span>
                                                            {absNames.length > 0 && (
                                                                <span className="text-xs text-slate-500 font-bold flex-1 overflow-visible capture-safe-text">
                                                                    休: {absNames.map(a => a.name).join(', ')}
                                                                </span>
                                                            )}
                                                        </div>
                                                    
                                                        <div className="flex items-center justify-between">
                                                            <div className="flex items-center justify-center space-x-1 w-[46%]">
                                                                <NameSpan player={p1} />
                                                                <NameSpan player={p2} />
                                                            </div>
                                                            <div className="w-[8%] text-center text-xs text-slate-400 font-bold capture-safe-text">vs</div>
                                                            <div className="flex items-center justify-center space-x-1 w-[46%]">
                                                                <NameSpan player={p3} />
                                                                <NameSpan player={p4} />
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="space-y-3 mt-4">
                                    <div className="flex justify-between items-center px-1">
                                        <button 
                                            type="button"
                                            onClick={() => setMatchPage(p => Math.max(0, p - 1))}
                                            disabled={matchPage === 0}
                                            className={`text-sm font-bold py-1.5 transition-colors ${
                                                matchPage > 0 
                                                ? 'text-slate-600 hover:text-slate-800 cursor-pointer active:scale-95' 
                                                : 'text-slate-300 cursor-not-allowed'
                                            }`}
                                        >
                                            ← 前の10試合
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={handleNextPageOrGenerate}
                                            className="text-sm font-bold py-1.5 text-slate-600 hover:text-slate-800 transition-colors active:scale-95 cursor-pointer"
                                        >
                                            次の10試合 →
                                        </button>
                                    </div>
                                    
                                    <div>
                                        <button
                                            type="button"
                                            onClick={handleCopyImage}
                                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                        >
                                            対戦表を画像でコピーする
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-100 border-t border-slate-200 h-[48px] flex items-center px-6 shadow-lg">
                        <div className="max-w-md w-full mx-auto flex items-center justify-between px-2 -translate-y-2">
                            <div className="w-16 flex justify-start">
                                {page === 'group' && (
                                    <button
                                        type="button"
                                        onClick={handleGoHome}
                                        className="text-base font-bold text-emerald-600 hover:text-emerald-800 transition-colors"
                                    >
                                        ❮ HOME
                                    </button>
                                )}
                                {page === 'match' && (
                                    <button
                                        type="button"
                                        onClick={handleBackToGroup}
                                        className="text-base font-bold text-emerald-600 hover:text-emerald-800 transition-colors"
                                    >
                                        ❮ 設定
                                    </button>
                                )}
                            </div>

                            <div className="text-[11px] font-bold text-slate-500 overflow-visible px-1 text-center flex-1 capture-safe-text">
                                😊 にっこりAI対戦表メーカー
                            </div>

                            <div className="w-16 flex justify-end">
                                {page === 'group' && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (matchList.length > 0) {
                                                setPage('match');
                                            } else {
                                                handleCreateMatchTable();
                                            }
                                        }}
                                        className="text-base font-bold text-emerald-600 hover:text-emerald-800 transition-colors"
                                    >
                                        対戦表 ❯
                                    </button>
                                )}
                            </div>
                        </div>
                    </footer>

                    {showContinueModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-[200px] w-full p-4 space-y-3 shadow-2xl relative">
                                <h3 className="font-extrabold text-sm text-slate-800 text-center">
                                    何試合目から変更しますか。
                                </h3>
                                <div className="flex items-center justify-center space-x-1">
                                    <input 
                                        type="number" 
                                        min="1"
                                        max={matchList.length + 1}
                                        value={startMatchNumInput}
                                        onChange={(e) => setStartMatchNumInput(e.target.value)}
                                        className="w-16 bg-slate-50 border border-slate-200 focus:border-emerald-500 rounded-lg px-2 py-1 outline-none text-center font-bold text-slate-800"
                                    />
                                    <span className="text-xs font-bold text-slate-600">試合目</span>
                                </div>
                                <div className="flex space-x-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowContinueModal(false)}
                                        className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 text-sm rounded-xl transition-all shadow-sm"
                                    >
                                        取消
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setLastBoundaryIndex(parseInt(startMatchNumInput, 10) - 1);
                                            handleExecuteContinue();
                                        }}
                                        className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 text-sm rounded-xl transition-all shadow-sm"
                                    >
                                        OK
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showImageModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                                <div className="text-center space-y-1">
                                    <h3 className="font-extrabold text-lg text-slate-800">
                                        画像が生成されました
                                    </h3>
                                    <p className="text-xs text-slate-500 leading-normal">
                                        ブラウザの制限によりクリップボードへ直接コピーできませんでした。画像を長押しして保存してください。
                                    </p>
                                </div>

                                <div className="border border-slate-200 rounded-xl overflow-hidden shadow-inner max-h-[380px] overflow-y-auto">
                                    <img src={capturedImage} alt="Match Schedule" className="w-full h-auto block" />
                                </div>

                                <div className="flex justify-center">
                                    <button
                                        type="button"
                                        onClick={() => setShowImageModal(false)}
                                        className="text-slate-600 hover:text-slate-800 font-bold py-2 px-6 text-xs transition-all w-full"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed bottom-14 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white font-bold text-xs py-2 px-5 rounded-full shadow-lg whitespace-nowrap">
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        function EmptyRowCreator({ onAddMember, nextNumber, getLevelBadgeClass }) {
            const [name, setName] = useState("");
            const [level, setLevel] = useState("未設定");
            
            const handleTriggerAdd = (gender) => {
                const finalName = name.trim() || `名前${nextNumber}`;
                onAddMember(finalName, gender, level);
                setName(""); 
            };

            const toggleLevel = () => {
                const nextIdx = (LEVELS.indexOf(level) + 1) % LEVELS.length;
                setLevel(LEVELS[nextIdx]);
            };

            return (
                <div className="flex items-center space-x-1.5 p-1">
                    <div className="w-11 shrink-0"></div>
                    
                    {/* 名前入力枠 */}
                    <input
                        type="text"
                        value={name}
                        onChange={(e) => { if (e.target.value.length <= 4) setName(e.target.value); }}
                        placeholder={`名前${nextNumber}`}
                        maxLength={4}
                        className="flex-1 min-w-0 bg-white border border-slate-200 focus:border-emerald-500 rounded px-2 py-1 outline-none text-xs font-bold text-slate-800 placeholder:text-slate-300 placeholder:font-normal shrink-0"
                    />

                    {/* 男女ボタン */}
                    <div className="flex space-x-0.5 shrink-0 w-12">
                        <button
                            type="button"
                            onClick={() => handleTriggerAdd('M')}
                            className="w-6 py-1 text-xs font-bold rounded border border-sky-200 text-sky-500 hover:bg-sky-50 transition-all bg-white"
                        >
                            男
                        </button>
                        <button
                            type="button"
                            onClick={() => handleTriggerAdd('F')}
                            className="w-6 py-1 text-xs font-bold rounded border border-rose-200 text-rose-500 hover:bg-rose-50 transition-all bg-white"
                        >
                            女
                        </button>
                    </div>

                    {/* レベルトグルボタン */}
                    <button
                        type="button"
                        onClick={toggleLevel}
                        className={`w-16 py-1 px-0.5 text-xs font-bold rounded border transition-all truncate text-center shrink-0 ${getLevelBadgeClass(level)}`}
                        title="タップしてレベル変更"
                    >
                        {level}
                    </button>

                    <div className="w-6 shrink-0"></div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
