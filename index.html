<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>にっこりAI対戦表メーカー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Line+Seed+JP:wght@400;700;800&family=Nunito:wght@400;700;900&display=swap');
        body {
            font-family: 'Line Seed JP', 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .capture-safe-text {
            line-height: 1.25 !important;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-slate-50">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                <line x1="10" x2="10" y1="11" y2="17" />
                <line x1="14" x2="14" y1="11" y2="17" />
            </svg>
        );

        const DEFAULT_GROUPS = [];

        const PRIORITY_LABELS = {
            count: '出場数均等',
            break: '連続休憩回避',
            consecutive: '連続出場回避',
            pair: '同一ペア回避',
            opponent: '同一相手回避',
            card: '同一カード回避',
            gender: '男女バランス',
            level: 'レベルバランス'
        };

        const DEFAULT_PRIORITY = ['count', 'break', 'consecutive', 'pair', 'opponent', 'card', 'gender', 'level'];
        const DEFAULT_GENDER_MODE = 'consider';

        const LEVELS = ['未設定', '初級', '初中級', '中級', '中上級', '上級'];

        const ensurePriorityList = (pList) => {
            if (!Array.isArray(pList)) return DEFAULT_PRIORITY;
            let list = pList.filter(p => Object.keys(PRIORITY_LABELS).includes(p));
            DEFAULT_PRIORITY.forEach(dp => {
                if (!list.includes(dp)) list.push(dp);
            });
            return list;
        };

        const normalizeGenderMode = (mode) => {
            if (['mix', 'balance', 'consider', 'none'].includes(mode)) return mode;
            return DEFAULT_GENDER_MODE;
        };

        const calculateBaseStats = (pastHistory, currentMembers) => {
            const presentMembers = currentMembers.filter(m => m.present);
            const baseStats = {};
            const rawStats = {};
            
            presentMembers.forEach(m => {
                rawStats[m.id] = { matchCount: 0, consecutiveRest: 0, consecutivePlay: 0 };
            });
            
            pastHistory.forEach(h => {
                presentMembers.forEach(m => {
                    if (h.players.includes(m.id)) {
                        rawStats[m.id].matchCount++;
                        rawStats[m.id].consecutivePlay++;
                        rawStats[m.id].consecutiveRest = 0;
                    } else if (h.absentees.includes(m.id)) {
                        rawStats[m.id].consecutiveRest++;
                        rawStats[m.id].consecutivePlay = 0;
                    } else {
                        rawStats[m.id].consecutivePlay = 0;
                        rawStats[m.id].consecutiveRest = 0; 
                    }
                });
            });

            const lastMatch = pastHistory[pastHistory.length - 1];
            let minMatchCount = Infinity;
            let maxConsecutiveRest = -1;
            
            const normalMembers = presentMembers.filter(m => 
                lastMatch ? (lastMatch.players.includes(m.id) || lastMatch.absentees.includes(m.id)) : true
            );

            if (normalMembers.length > 0) {
                normalMembers.forEach(m => {
                    if (rawStats[m.id].matchCount < minMatchCount) minMatchCount = rawStats[m.id].matchCount;
                    if (rawStats[m.id].consecutiveRest > maxConsecutiveRest) maxConsecutiveRest = rawStats[m.id].consecutiveRest;
                });
            } else {
                minMatchCount = 0;
                maxConsecutiveRest = 0;
            }
            
            presentMembers.forEach(m => {
                const isNew = !pastHistory.some(h => h.players.includes(m.id) || h.absentees.includes(m.id));
                const isReturn = !isNew && lastMatch && !lastMatch.players.includes(m.id) && !lastMatch.absentees.includes(m.id);

                if (isNew || isReturn) {
                    baseStats[m.id] = {
                        matchCount: Math.max(rawStats[m.id].matchCount, Math.max(0, minMatchCount)),
                        consecutivePlay: 0,
                        consecutiveRest: maxConsecutiveRest
                    };
                } else {
                    baseStats[m.id] = { ...rawStats[m.id] };
                }
            });

            return baseStats;
        };

        const getStats = (playerId, futureHistory, baseStatsMap) => {
            let stats = baseStatsMap && baseStatsMap[playerId] 
                ? { ...baseStatsMap[playerId] } 
                : { matchCount: 0, consecutiveRest: 0, consecutivePlay: 0 };

            for (const h of futureHistory) {
                if (h.players.includes(playerId)) {
                    stats.matchCount++;
                    stats.consecutivePlay++;
                    stats.consecutiveRest = 0;
                } else if (h.absentees.includes(playerId)) {
                    stats.consecutiveRest++;
                    stats.consecutivePlay = 0;
                }
            }
            return stats;
        };

        const calculatePenalty = (config, criterion, futureHistory, pastHistory, genderMode, presentMembers, baseStatsMap, pairRules = []) => {
            const fullHistory = [...pastHistory, ...futureHistory];
            const courtIds = new Set(config.players.map(p => p.id));
            
            if (criterion === 'level') {
                return 0;
            }

            if (criterion === 'count') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newCount = stats.matchCount + (courtIds.has(m.id) ? 1 : 0);
                    sum += Math.pow(newCount, 2);
                });
                return sum;
            }
            
            if (criterion === 'break') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newBreak = courtIds.has(m.id) ? 0 : stats.consecutiveRest + 1;
                    sum += Math.pow(newBreak, 2);
                });
                return sum;
            }
            
            if (criterion === 'consecutive') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newCons = courtIds.has(m.id) ? stats.consecutivePlay + 1 : 0;
                    sum += Math.pow(newCons, 2);
                });
                return sum;
            }
            
            if (criterion === 'pair') {
                let sum = 0;
                const t1 = config.t1.map(p => p.id);
                const t2 = config.t2.map(p => p.id);
                
                const getPairCount = (pA, pB) => {
                    let count = 0;
                    fullHistory.forEach(m => {
                        if ((m.t1.includes(pA) && m.t1.includes(pB)) || 
                            (m.t2.includes(pA) && m.t2.includes(pB))) {
                            count++;
                        }
                    });
                    return count;
                };

                presentMembers.forEach(m => {
                    if (t1.includes(m.id)) {
                        const partner = t1[0] === m.id ? t1[1] : t1[0];
                        sum += Math.pow(getPairCount(m.id, partner) + 1, 2);
                    } else if (t2.includes(m.id)) {
                        const partner = t2[0] === m.id ? t2[1] : t2[0];
                        sum += Math.pow(getPairCount(m.id, partner) + 1, 2);
                    }
                });
                return sum;
            }

            if (criterion === 'opponent') {
                let sum = 0;
                const t1 = config.t1.map(p => p.id);
                const t2 = config.t2.map(p => p.id);

                const getOpponentCount = (pA, pB) => {
                    let count = 0;
                    fullHistory.forEach(m => {
                        if ((m.t1.includes(pA) && m.t2.includes(pB)) || 
                            (m.t2.includes(pA) && m.t1.includes(pB))) {
                            count++;
                        }
                    });
                    return count;
                };

                presentMembers.forEach(m => {
                    if (t1.includes(m.id)) {
                        sum += Math.pow(getOpponentCount(m.id, t2[0]) + 1, 2) + Math.pow(getOpponentCount(m.id, t2[1]) + 1, 2);
                    } else if (t2.includes(m.id)) {
                        sum += Math.pow(getOpponentCount(m.id, t1[0]) + 1, 2) + Math.pow(getOpponentCount(m.id, t1[1]) + 1, 2);
                    }
                });
                return sum;
            }

            if (criterion === 'card') {
                const t1 = config.t1.map(p => p.id).sort().join(',');
                const t2 = config.t2.map(p => p.id).sort().join(',');
                let count = 0;
                fullHistory.forEach(m => {
                    const ht1 = [...m.t1].sort().join(',');
                    const ht2 = [...m.t2].sort().join(',');
                    if ((t1 === ht1 && t2 === ht2) || (t1 === ht2 && t2 === ht1)) {
                        count++;
                    }
                });
                return count + 1;
            }
            
            if (criterion === 'gender') {
                if (genderMode === 'none') return 0;

                const t1Males = config.t1.filter(p => p.gender === "M").length;
                const t2Males = config.t2.filter(p => p.gender === "M").length;
                
                const isM1F1_vs_M1F1 = t1Males === 1 && t2Males === 1;
                const isM2F0_vs_M2F0 = t1Males === 2 && t2Males === 2;
                const isM0F2_vs_M0F2 = t1Males === 0 && t2Males === 0;
                const isM2F0_vs_M1F1 = (t1Males === 2 && t2Males === 1) || (t1Males === 1 && t2Males === 2);
                const isM0F2_vs_M1F1 = (t1Males === 0 && t2Males === 1) || (t1Males === 1 && t2Males === 0);
                const isM2F0_vs_M0F2 = (t1Males === 2 && t2Males === 0) || (t1Males === 0 && t2Males === 2);

                let score = 0;

                if (genderMode === 'mix') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 20;
                    else if (isM0F2_vs_M1F1) score = 20;
                    else if (isM2F0_vs_M2F0) score = 20;
                    else if (isM0F2_vs_M0F2) score = 20;
                    else if (isM2F0_vs_M0F2) score = 20;
                } else if (genderMode === 'balance') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 20;
                    else if (isM0F2_vs_M1F1) score = 20;
                    else if (isM2F0_vs_M2F0) score = 0;
                    else if (isM0F2_vs_M0F2) score = 0;
                    else if (isM2F0_vs_M0F2) score = 20;
                } else if (genderMode === 'consider') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 10;
                    else if (isM0F2_vs_M1F1) score = 10;
                    else if (isM2F0_vs_M2F0) score = 0;
                    else if (isM0F2_vs_M0F2) score = 0;
                    else if (isM2F0_vs_M0F2) score = 20;
                }
                
                return score;
            }
            return 0;
        };

        function evaluateAndCreateNextMatch(presentMembers, futureHistory, pastHistory, priorityOrder, genderMode, baseStatsMap, pairRules = []) {
            if (presentMembers.length < 4) return null;

            const N = presentMembers.length;
            const configurations = [];

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        for (let l = k + 1; l < N; l++) {
                            const p1 = presentMembers[i];
                            const p2 = presentMembers[j];
                            const p3 = presentMembers[k];
                            const p4 = presentMembers[l];

                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p2], t2: [p3, p4] });
                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p3], t2: [p2, p4] });
                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p4], t2: [p2, p3] });
                        }
                    }
                }
            }

            let validConfigurations = configurations.map(config => {
                let extraPenalty = 0;
                const t1Ids = config.t1.map(p => p.id);
                const t2Ids = config.t2.map(p => p.id);
                const courtIds = new Set(config.players.map(p => p.id));

                for (const rule of pairRules) {
                    if (!rule.p1 || !rule.p2 || rule.level === 'off') continue;
                    
                    const p1InCourt = courtIds.has(rule.p1);
                    const p2InCourt = courtIds.has(rule.p2);

                    if (!p1InCourt || !p2InCourt) continue;

                    const isSameTeam = (t1Ids.includes(rule.p1) && t1Ids.includes(rule.p2)) || 
                                       (t2Ids.includes(rule.p1) && t2Ids.includes(rule.p2));

                    if (rule.type === 'fix') {
                        if (!isSameTeam) {
                            if (rule.level === 'must') extraPenalty += 1000000;
                            else if (rule.level === 'prefer') extraPenalty += 5000;
                        }
                    } else if (rule.type === 'avoid') {
                        if (isSameTeam) {
                            if (rule.level === 'must') extraPenalty += 1000000;
                            else if (rule.level === 'prefer') extraPenalty += 5000;
                        }
                    }
                }

                return { config, extraPenalty };
            });

            const minExtraPenalty = Math.min(...validConfigurations.map(c => c.extraPenalty));
            let candidates = validConfigurations
                .filter(c => c.extraPenalty === minExtraPenalty)
                .map(c => c.config);

            if (candidates.length === 0) candidates = configurations;

            for (const criterion of priorityOrder) {
                const scores = candidates.map(config => calculatePenalty(config, criterion, futureHistory, pastHistory, genderMode, presentMembers, baseStatsMap, pairRules));
                const minScore = Math.min(...scores);
                
                candidates = candidates.filter((_, idx) => scores[idx] === minScore);
                if (candidates.length === 1) break;
            }

            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            const chosenCourtIds = new Set(chosen.players.map(p => p.id));
            const chosenAbsentees = presentMembers.filter(m => !chosenCourtIds.has(m.id));

            return {
                id: `temp-${Date.now()}`,
                players: chosen.players.map(p => p.id),
                t1: chosen.t1.map(p => p.id),
                t2: chosen.t2.map(p => p.id),
                absentees: chosenAbsentees.map(p => p.id)
            };
        }

        function App() {
            const [page, setPage] = useState('top');
            const [groups, setGroups] = useState([]);
            const [activeGroupId, setActiveGroupId] = useState(null);
            
            const [groupName, setGroupName] = useState('');
            const [members, setMembers] = useState([]);
            const [pairRules, setPairRules] = useState([]);
            
            const [activeTab, setActiveTab] = useState('members');

            const [priorityOrder, setPriorityOrder] = useState(DEFAULT_PRIORITY);
            const [genderMode, setGenderMode] = useState(DEFAULT_GENDER_MODE);
            const [isGenderExpanded, setIsGenderExpanded] = useState(false);
            
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [matchList, setMatchList] = useState([]);
            const [matchPage, setMatchPage] = useState(0);
            
            const [toast, setToast] = useState({ show: false, message: "" });
            const [capturedImage, setCapturedImage] = useState(null);
            const [showImageModal, setShowImageModal] = useState(false);
            
            const [showContinueModal, setShowContinueModal] = useState(false);
            const [startMatchNumInput, setStartMatchNumInput] = useState("1");
            const [lastBoundaryIndex, setLastBoundaryIndex] = useState(0);

            const bottomRef = useRef(null);
            const tabContentRef = useRef(null);
            const genderAccordionBottomRef = useRef(null);

            const prevMembersLength = useRef(members.length);
            const prevPairRulesLength = useRef(pairRules.length);

            const presentCount = members.filter(m => m.present).length;

            useEffect(() => {
                const stored = localStorage.getItem('nikkori_tennis_groups_v3');
                if (stored) {
                    try {
                        setGroups(JSON.parse(stored));
                    } catch (e) {
                        setGroups(DEFAULT_GROUPS);
                    }
                } else {
                    setGroups(DEFAULT_GROUPS);
                }
            }, []);

            // メンバー追加時のアンカリング（デフォルトの枠高さ360pxを超えたときだけ行う）
            useEffect(() => {
                if (members.length > prevMembersLength.current) {
                    setTimeout(() => {
                        if (tabContentRef.current) {
                            const isOverMinHeight = tabContentRef.current.offsetHeight > 365;
                            const rect = tabContentRef.current.getBoundingClientRect();
                            const isBelowViewport = rect.bottom > window.innerHeight;
                            if (isOverMinHeight || isBelowViewport) {
                                bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
                            }
                        }
                    }, 100);
                }
                prevMembersLength.current = members.length;
            }, [members.length]);

            // ペア設定追加時のアンカリング（デフォルトの枠高さ360pxを超えたときだけ行う）
            useEffect(() => {
                if (pairRules.length > prevPairRulesLength.current) {
                    setTimeout(() => {
                        if (tabContentRef.current) {
                            const isOverMinHeight = tabContentRef.current.offsetHeight > 365;
                            const rect = tabContentRef.current.getBoundingClientRect();
                            const isBelowViewport = rect.bottom > window.innerHeight;
                            if (isOverMinHeight || isBelowViewport) {
                                bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
                            }
                        }
                    }, 100);
                }
                prevPairRulesLength.current = pairRules.length;
            }, [pairRules.length]);

            // 条件設定画面：男女バランスの＋を展開した時に「男女バランス考慮なし」までスクロール表示する
            useEffect(() => {
                if (isGenderExpanded) {
                    setTimeout(() => {
                        genderAccordionBottomRef.current?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 120);
                }
            }, [isGenderExpanded]);

            const triggerToast = (msg) => {
                setToast({ show: true, message: msg });
                setTimeout(() => setToast({ show: false, message: "" }), 2500);
            };

            const handleGoHome = () => {
                setPage('top');
                setActiveGroupId(null);
                setDeleteConfirmId(null);
            };
            
            const handleBackToGroup = () => {
                setPage('group');
            };

            const handleCreateNewGroup = () => {
                const newId = `group-${Date.now()}`;
                const newGroup = {
                    id: newId,
                    name: "",
                    members: [],
                    pairRules: [],
                    settings: { priority: DEFAULT_PRIORITY, genderMode: DEFAULT_GENDER_MODE },
                    matchList: []
                };
                const updated = [...groups, newGroup];
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
                
                setActiveGroupId(newId);
                setGroupName("");
                setMembers([]);
                setPairRules([]);
                setMatchList([]);
                setPriorityOrder(newGroup.settings.priority);
                setGenderMode(normalizeGenderMode(newGroup.settings.genderMode));
                setIsGenderExpanded(false);
                setActiveTab('members');
                setDeleteConfirmId(null);
                setPage('group');
            };

            const handleSelectGroup = (gId) => {
                const target = groups.find(g => g.id === gId);
                if (!target) return;
                setActiveGroupId(gId);
                setGroupName(target.name);
                setMembers(target.members || []);
                setPairRules(target.pairRules || []);
                setMatchList(target.matchList || []);
                setPriorityOrder(ensurePriorityList(target.settings?.priority));
                setGenderMode(normalizeGenderMode(target.settings?.genderMode));
                setIsGenderExpanded(false);
                setActiveTab('members');
                setDeleteConfirmId(null);
                setPage('group');
            };

            const handleMoveGroup = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= groups.length) return;
                const updated = [...groups];
                const temp = updated[index];
                updated[index] = updated[targetIndex];
                updated[targetIndex] = temp;
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
            };

            const handleSaveGroup = () => {
                const resolvedName = groupName.trim() || "（名称未設定のグループ）";
                const cleanMembers = members.filter(m => m.name.trim() !== "");

                const validMemberIds = new Set(cleanMembers.map(m => m.id));
                const cleanPairRules = pairRules.filter(r => 
                    r.p1 && r.p2 && validMemberIds.has(r.p1) && validMemberIds.has(r.p2)
                );

                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { 
                            ...g, 
                            name: resolvedName, 
                            members: cleanMembers, 
                            pairRules: cleanPairRules,
                            settings: { priority: priorityOrder, genderMode: genderMode },
                            matchList: matchList 
                        };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                setMembers(cleanMembers);
                setPairRules(cleanPairRules);
                setGroupName(resolvedName);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));
                triggerToast("💾 保存しました");
            };

            const handleDeleteGroupById = (gId) => {
                const updated = groups.filter(g => g.id !== gId);
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
                setDeleteConfirmId(null);
                triggerToast("🗑️ グループを削除しました");
                if (activeGroupId === gId) {
                    setPage('top');
                    setActiveGroupId(null);
                }
            };

            const updateMemberName = (index, newName) => {
                if (newName.length > 4) return;
                const isDuplicate = members.some((m, i) => i !== index && m.name === newName && newName !== "");
                if (isDuplicate) {
                    triggerToast("⚠️ 同じメンバー名は使えません");
                    return; 
                }
                const copy = [...members];
                copy[index].name = newName;
                setMembers(copy);
            };

            const toggleMemberGender = (index, gender) => {
                const copy = [...members];
                copy[index].gender = gender;
                setMembers(copy);
            };

            const toggleMemberLevel = (index) => {
                const copy = [...members];
                const currentLevel = copy[index].level || '未設定';
                const nextIdx = (LEVELS.indexOf(currentLevel) + 1) % LEVELS.length;
                copy[index].level = LEVELS[nextIdx];
                setMembers(copy);
            };

            const toggleMemberPresence = (index) => {
                const copy = [...members];
                if (!copy[index].present && presentCount >= 12) {
                    triggerToast("⚠️ 参加者は最大12名までです");
                    return;
                }
                copy[index].present = !copy[index].present;
                setMembers(copy);
            };

            const deleteMember = (index) => {
                const deletedMemberId = members[index].id;
                const copy = [...members];
                copy.splice(index, 1);
                setMembers(copy);

                setPairRules(prev => prev.filter(r => r.p1 !== deletedMemberId && r.p2 !== deletedMemberId));
            };

            const handleAddMember = (name, gender, level = '未設定') => {
                if (members.some(m => m.name === name)) {
                    triggerToast("⚠️ 同じメンバー名は使えません");
                    return;
                }
                const isPresent = presentCount < 12;
                const newM = {
                    id: `member-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                    name: name.slice(0, 4),
                    gender: gender,
                    level: level,
                    present: isPresent
                };
                setMembers([...members, newM]);
                if (!isPresent) triggerToast("⚠️ 最大参加人数の12名に達したため不参加で登録しました");
            };

            const validatePairRule = (targetRuleId, newP1, newP2, newType, newLevel) => {
                if (!newP1 || !newP2) return true;

                if (newP1 === newP2) {
                    triggerToast("⚠️ 同じメンバー同士は選択できません");
                    return false;
                }

                for (const rule of pairRules) {
                    if (rule.id === targetRuleId) continue;
                    if (!rule.p1 || !rule.p2) continue;

                    const isSamePair = (rule.p1 === newP1 && rule.p2 === newP2) || (rule.p1 === newP2 && rule.p2 === newP1);

                    if (isSamePair) {
                        triggerToast("⚠️ 同じペアの設定が既に存在します");
                        return false;
                    }
                }

                if (newType === 'fix' && newLevel !== 'off') {
                    for (const rule of pairRules) {
                        if (rule.id === targetRuleId) continue;
                        if (!rule.p1 || !rule.p2 || rule.type !== 'fix' || rule.level === 'off') continue;

                        if (rule.p1 === newP1 || rule.p2 === newP1) {
                            const partnerId = rule.p1 === newP1 ? rule.p2 : rule.p1;
                            const partner = members.find(m => m.id === partnerId);
                            const currentM = members.find(m => m.id === newP1);
                            triggerToast(`⚠️ ${currentM?.name || ''}さんはすでに${partner?.name || ''}さんと固定ペアになっています`);
                            return false;
                        }

                        if (rule.p1 === newP2 || rule.p2 === newP2) {
                            const partnerId = rule.p1 === newP2 ? rule.p2 : rule.p1;
                            const partner = members.find(m => m.id === partnerId);
                            const currentM = members.find(m => m.id === newP2);
                            triggerToast(`⚠️ ${currentM?.name || ''}さんはすでに${partner?.name || ''}さんと固定ペアになっています`);
                            return false;
                        }
                    }
                }

                return true;
            };

            const handleAddPairRule = () => {
                const newRule = {
                    id: `pair-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                    p1: '',
                    p2: '',
                    type: 'fix',
                    level: 'must'
                };
                setPairRules([...pairRules, newRule]);
            };

            const handleUpdatePairRule = (id, field, value) => {
                const rule = pairRules.find(r => r.id === id);
                if (!rule) return;

                let nextP1 = field === 'p1' ? value : rule.p1;
                let nextP2 = field === 'p2' ? value : rule.p2;
                let nextType = field === 'type' ? value : rule.type;
                let nextLevel = field === 'level' ? value : rule.level;

                if (!validatePairRule(id, nextP1, nextP2, nextType, nextLevel)) {
                    return;
                }

                setPairRules(pairRules.map(r => {
                    if (r.id === id) {
                        return { ...r, [field]: value };
                    }
                    return r;
                }));
            };

            const handleDeletePairRule = (id) => {
                setPairRules(pairRules.filter(r => r.id !== id));
            };

            const handleCreateMatchTable = () => {
                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);

                if (activeAttendees.length < 4) {
                    triggerToast("⚠️ 試合を行うには参加者が最低4人必要です");
                    return;
                }

                handleSaveGroup();

                const generated = [];
                const baseStatsMap = {}; 
                activeAttendees.forEach(m => baseStatsMap[m.id] = {matchCount:0, consecutivePlay:0, consecutiveRest:0});

                for (let i = 0; i < 10; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, generated, [], priorityOrder, genderMode, baseStatsMap, pairRules);
                    if (nextMatch) generated.push(nextMatch);
                    else break;
                }

                const finalizedList = generated.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);
                setLastBoundaryIndex(0);
                
                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                setMatchPage(0);
                setPage('match');
            };

            const handleOpenContinueModal = () => {
                setStartMatchNumInput("1");
                setShowContinueModal(true);
            };

            const handleExecuteContinue = () => {
                const startNum = parseInt(startMatchNumInput, 10);
                if (isNaN(startNum) || startNum < 1 || startNum > matchList.length + 1) {
                    triggerToast("⚠️ 正しい開始試合数を入力してください");
                    return;
                }

                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);

                if (activeAttendees.length < 4) {
                    triggerToast("⚠️ 試合を行うには参加者が最低4人必要です");
                    setShowContinueModal(false);
                    return;
                }

                handleSaveGroup();

                const pastHistory = matchList.slice(0, startNum - 1);
                const baseStatsMap = calculateBaseStats(pastHistory, cleanMembers);

                const generated = [];
                for (let i = 0; i < 10; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, generated, pastHistory, priorityOrder, genderMode, baseStatsMap, pairRules);
                    if (nextMatch) generated.push(nextMatch);
                    else break;
                }

                const newMatchList = [...pastHistory, ...generated];
                
                const finalizedList = newMatchList.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);

                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                const targetPage = Math.floor((startNum - 1) / 10);
                setMatchPage(targetPage);
                
                setPage('match');
                setShowContinueModal(false);
            };

            const handleNextPageOrGenerate = () => {
                const targetPageIndex = matchPage + 1;
                const requiredMatchesCount = (targetPageIndex + 1) * 10;

                if (matchList.length >= requiredMatchesCount) {
                    setMatchPage(targetPageIndex);
                    return;
                }

                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);
                if (activeAttendees.length < 4) return;

                const nextTen = [];
                const baseStatsMap = calculateBaseStats(matchList, cleanMembers);

                for (let i = 0; i < 10; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, nextTen, matchList, priorityOrder, genderMode, baseStatsMap, pairRules);
                    if (nextMatch) nextTen.push(nextMatch);
                    else break;
                }

                if (nextTen.length === 0) {
                    triggerToast("⚠️ これ以上組み合わせを作れません");
                    return;
                }
                
                const newMatchList = [...matchList, ...nextTen];
                const finalizedList = newMatchList.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);
                
                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                setMatchPage(targetPageIndex);
            };

            const handleCopyImage = async () => {
                const element = document.getElementById('match-table-capture-area');
                if (!element) return;
                
                triggerToast("⏳ コピー中...");
                
                try {
                    const canvas = await html2canvas(element, {
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        logging: false,
                        onclone: (clonedDoc) => {
                            const targetElements = clonedDoc.querySelectorAll('.capture-safe-text');
                            targetElements.forEach(el => {
                                el.style.position = 'relative';
                                const text = el.textContent.trim();
                                
                                if (text.toLowerCase() === 'vs') {
                                    el.style.top = '-10px';
                                } else if (el.classList.contains('w-[48%]')) {
                                    el.style.top = '-2px';
                                } else if (el.parentElement && el.parentElement.classList.contains('w-[48%]')) {
                                    el.style.top = '-6px';
                                } else {
                                    el.style.top = '-8px';
                                }
                            });
                        }
                    });

                    canvas.toBlob(async (blob) => {
                        try {
                            const item = new ClipboardItem({ "image/png": blob });
                            await navigator.clipboard.write([item]);
                            triggerToast("✅ コピー完了");
                        } catch (err) {
                            console.error("Clipboard API error:", err);
                            const imgData = URL.createObjectURL(blob);
                            setCapturedImage(imgData);
                            setShowImageModal(true);
                            triggerToast("⚠️ コピーに失敗しました。画像を手動で保存してください。");
                        }
                    }, 'image/png');
                } catch (e) {
                    console.error(e);
                    triggerToast("⚠️ 画像の生成に失敗しました");
                }
            };

            const movePriority = (index, direction) => {
                const newOrder = [...priorityOrder];
                const target = index + direction;
                if (target < 0 || target >= newOrder.length) return;
                [newOrder[index], newOrder[target]] = [newOrder[target], newOrder[index]];
                setPriorityOrder(newOrder);
            };

            const getMemberName = (id) => {
                const m = members.find(p => p.id === id);
                if (!m) return { name: "??", isMale: true };
                return { name: m.name, isMale: m.gender === "M" };
            };

            const getGenderBadgeText = (mode) => {
                switch (mode) {
                    case 'mix': return 'ミックス';
                    case 'balance': return '均等';
                    case 'consider': return 'やや考慮';
                    case 'none': return '考慮なし';
                    default: return 'やや考慮';
                }
            };

            const NameSpan = ({ player }) => {
                const len = player.name.length;
                const textSize = len >= 4 ? 'text-xs' : 'text-sm';
                const bgColor = player.isMale ? 'bg-sky-50 text-sky-700 border-sky-100' : 'bg-rose-50 text-rose-700 border-rose-100';
                
                return (
                    <div className={`w-[48%] h-[18px] flex items-center justify-center font-bold rounded border ${bgColor} ${textSize} leading-none py-0 px-0.5 capture-safe-text`}>
                        <span className="whitespace-nowrap overflow-visible capture-safe-text">{player.name}</span>
                    </div>
                );
            };

            const getLevelBadgeClass = (level) => {
                switch (level) {
                    case '初級':
                        return 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100';
                    case '初中級':
                        return 'bg-teal-100 text-teal-800 border-teal-300 hover:bg-teal-200';
                    case '中級':
                        return 'bg-sky-200 text-sky-800 border-sky-400 hover:bg-sky-300';
                    case '中上級':
                        return 'bg-indigo-300 text-indigo-900 border-indigo-500 hover:bg-indigo-400';
                    case '上級':
                        return 'bg-purple-400 text-white border-purple-600 hover:bg-purple-500';
                    case '未設定':
                    default:
                        return 'bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100';
                }
            };

            const d = new Date();
            const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
            const currentMatches = matchList.slice(matchPage * 10, (matchPage + 1) * 10);

            return (
                <div className="flex-grow flex flex-col justify-between pt-[50px] pb-[48px]">
                    
                    <header className="fixed top-0 left-0 right-0 z-40 bg-[#E9D44D] text-slate-800 h-[50px] flex items-center justify-center shadow-md">
                        <span className="text-sm tracking-widest uppercase text-slate-800 font-bold">
                            [広告募集中]
                        </span>
                    </header>

                    <main className="flex-grow max-w-md w-full mx-auto px-4 py-4">
                        {page === 'top' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-6 text-white shadow-md text-center">
                                    <h2 className="text-xl font-black mb-1">にっこりAI対戦表メーカー</h2>
                                    <p className="text-emerald-50 text-xs">簡単な操作でAIがダブルスの最適な対戦表を作成</p>
                                </div>

                                <div className="space-y-2.5">
                                    {groups.length === 0 ? (
                                        <div className="text-center py-8 bg-white border border-dashed border-slate-200 rounded-xl text-slate-400 text-sm">
                                            グループがありません。<br/>下のボタンから作成してください。
                                        </div>
                                    ) : (
                                        groups.map((g, index) => (
                                            <div key={g.id} className="flex items-center space-x-1.5">
                                                <div className="flex flex-col space-y-4 shrink-0">
                                                    <button
                                                        type="button"
                                                        onClick={() => handleMoveGroup(index, -1)}
                                                        disabled={index === 0}
                                                        className="w-7 h-4 bg-white border border-slate-200 hover:border-emerald-400 rounded text-[9px] font-bold text-slate-500 hover:text-emerald-600 flex items-center justify-center disabled:opacity-30 disabled:hover:border-slate-200 transition-colors"
                                                        title="上に移動"
                                                    >
                                                        ▲
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleMoveGroup(index, 1)}
                                                        disabled={index === groups.length - 1}
                                                        className="w-7 h-4 bg-white border border-slate-200 hover:border-emerald-400 rounded text-[9px] font-bold text-slate-500 hover:text-emerald-600 flex items-center justify-center disabled:opacity-30 disabled:hover:border-slate-200 transition-colors"
                                                        title="下に移動"
                                                    >
                                                        ▼
                                                    </button>
                                                </div>

                                                <button
                                                    type="button"
                                                    onClick={() => handleSelectGroup(g.id)}
                                                    className="flex-grow bg-white border border-slate-200 hover:border-emerald-400 rounded-xl py-2 px-3 shadow-sm text-left flex items-center justify-between group transition-all min-w-0"
                                                >
                                                    <div className="overflow-visible">
                                                        <div className="font-bold text-slate-800 group-hover:text-emerald-600 overflow-visible">
                                                            {g.name || "（名称未設定のグループ）"}
                                                        </div>
                                                        <div className="text-xs text-slate-400 mt-0.5">
                                                            メンバー: {g.members?.length || 0}名
                                                        </div>
                                                    </div>
                                                    <span className="text-slate-400 font-bold ml-1.5 text-sm group-hover:text-emerald-600 shrink-0">❯</span>
                                                </button>

                                                {deleteConfirmId === g.id ? (
                                                    <div className="flex items-center space-x-1 shrink-0 bg-rose-50 p-1 rounded-xl border border-rose-100">
                                                        <button 
                                                            type="button"
                                                            onClick={() => handleDeleteGroupById(g.id)} 
                                                            className="text-rose-600 hover:text-rose-700 text-xs font-bold px-1 py-0.5"
                                                        >
                                                            削除
                                                        </button>
                                                        <button 
                                                            type="button"
                                                            onClick={() => setDeleteConfirmId(null)} 
                                                            className="text-slate-500 hover:text-slate-700 text-xs font-bold px-1 py-0.5"
                                                        >
                                                            取消
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button
                                                        type="button"
                                                        onClick={() => setDeleteConfirmId(g.id)}
                                                        className="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-rose-500 rounded-xl hover:bg-rose-50 transition-colors shrink-0"
                                                        title="グループを削除"
                                                    >
                                                        <TrashIcon />
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    )}

                                    <div className="pt-2">
                                        <button
                                            type="button"
                                            onClick={handleCreateNewGroup}
                                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-4 rounded-xl shadow-sm text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                        >
                                            新規グループを作成する
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {page === 'group' && (
                            <div className="space-y-3">
                                <div className="bg-white rounded-2xl p-3 py-1.5 border border-slate-100 shadow-sm flex items-center justify-between">
                                    <div className="flex-grow min-w-0 mr-2">
                                        <input
                                            type="text"
                                            value={groupName}
                                            onChange={(e) => setGroupName(e.target.value)}
                                            placeholder="グループ名を入力"
                                            className="w-full font-bold text-lg outline-none py-0.5 transition-colors bg-transparent text-slate-800 mt-2"
                                        />
                                        <div className="text-xs text-slate-400 font-bold mt-0.2">
                                            メンバー: {members.length}名
                                        </div>
                                    </div>

                                    {deleteConfirmId === activeGroupId ? (
                                        <div className="flex items-center space-x-1 shrink-0 bg-rose-50 p-1 rounded-xl border border-rose-100">
                                            <button 
                                                type="button"
                                                onClick={() => handleDeleteGroupById(activeGroupId)} 
                                                className="text-rose-600 hover:text-rose-700 text-xs font-bold px-1 py-0.5"
                                            >
                                                削除
                                            </button>
                                            <button 
                                                type="button"
                                                onClick={() => setDeleteConfirmId(null)} 
                                                className="text-slate-500 hover:text-slate-700 text-xs font-bold px-1 py-0.5"
                                            >
                                                取消
                                            </button>
                                        </div>
                                    ) : (
                                        <button
                                            type="button"
                                            onClick={() => setDeleteConfirmId(activeGroupId)}
                                            className="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-rose-500 rounded-xl hover:bg-rose-50 transition-colors shrink-0"
                                            title="グループを削除"
                                        >
                                            <TrashIcon />
                                        </button>
                                    )}
                                </div>

                                <div>
                                    {/* タブヘッダー ＆ 保存ボタン */}
                                    <div className="flex items-center justify-between border-b border-slate-300 px-1 pt-1 bg-slate-200/50 rounded-t-2xl">
                                        <div className="flex space-x-1">
                                            <button
                                                type="button"
                                                onClick={() => setActiveTab('members')}
                                                className={`px-3.5 py-2 text-xs font-extrabold rounded-t-xl transition-all border-t border-x ${
                                                    activeTab === 'members'
                                                        ? 'bg-white text-emerald-600 shadow-sm border-slate-300 -mb-px relative z-10'
                                                        : 'bg-slate-200/90 text-slate-600 hover:text-slate-800 border-slate-300 hover:bg-slate-200'
                                                }`}
                                            >
                                                メンバー
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setActiveTab('pair');
                                                    if (pairRules.length === 0) {
                                                        handleAddPairRule();
                                                    }
                                                }}
                                                className={`px-3.5 py-2 text-xs font-extrabold rounded-t-xl transition-all border-t border-x ${
                                                    activeTab === 'pair'
                                                        ? 'bg-white text-emerald-600 shadow-sm border-slate-300 -mb-px relative z-10'
                                                        : 'bg-slate-200/90 text-slate-600 hover:text-slate-800 border-slate-300 hover:bg-slate-200'
                                                }`}
                                            >
                                                ペア設定
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setActiveTab('settings')}
                                                className={`px-3.5 py-2 text-xs font-extrabold rounded-t-xl transition-all border-t border-x ${
                                                    activeTab === 'settings'
                                                        ? 'bg-white text-emerald-600 shadow-sm border-slate-300 -mb-px relative z-10'
                                                        : 'bg-slate-200/90 text-slate-600 hover:text-slate-800 border-slate-300 hover:bg-slate-200'
                                                }`}
                                            >
                                                条件設定
                                            </button>
                                        </div>

                                        {/* 保存ボタン */}
                                        <button
                                            type="button"
                                            onClick={handleSaveGroup}
                                            className="mb-1 mr-1 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition-all shadow-sm active:scale-95 flex items-center space-x-1 shrink-0"
                                        >
                                            <span>💾 保存</span>
                                        </button>
                                    </div>

                                    {/* タブコンテンツエリア（デフォルト高さ min-h-[360px] 固定） */}
                                    <div ref={tabContentRef} className="bg-white rounded-b-2xl p-3 border border-slate-300 border-t-0 shadow-sm min-h-[360px]">
                                        {activeTab === 'members' && (
                                            <div className="space-y-0.5">
                                                <div className="flex items-center space-x-1.5 px-1 pt-0.5 pb-1 text-[11px] font-bold text-slate-500 border-b border-slate-100">
                                                    <div className="w-11 text-center text-emerald-600 font-extrabold shrink-0">
                                                        参加{presentCount}名
                                                    </div>
                                                    <div className="flex-1 text-center text-slate-400 font-normal min-w-0">
                                                        名前(4文字以内)
                                                    </div>
                                                    <div className="w-12 text-center text-slate-400 font-normal shrink-0">
                                                        性別
                                                    </div>
                                                    <div className="w-16 text-center text-slate-400 font-normal shrink-0">
                                                        レベル
                                                    </div>
                                                    <div className="w-6 shrink-0"></div>
                                                </div>

                                                <div className="space-y-1.5 pb-1">
                                                    {members.map((m, index) => (
                                                        <div key={m.id} className="flex items-center space-x-1.5 p-1 border-b border-slate-50">
                                                            <button
                                                                type="button"
                                                                onClick={() => toggleMemberPresence(index)}
                                                                className={`w-11 py-1 text-xs font-bold rounded shadow-sm transition-all shrink-0 ${
                                                                    m.present 
                                                                    ? 'bg-emerald-500 text-white' 
                                                                    : 'bg-slate-200 text-slate-500'
                                                                }`}
                                                            >
                                                                {m.present ? '参加' : '不参加'}
                                                            </button>

                                                            {/* 名前入力枠 */}
                                                            <input
                                                                type="text"
                                                                value={m.name}
                                                                onChange={(e) => updateMemberName(index, e.target.value)}
                                                                maxLength={4}
                                                                className={`flex-1 min-w-0 bg-white border border-slate-200 focus:border-emerald-500 rounded px-2 py-1 outline-none text-xs font-bold shrink-0 ${!m.present ? 'text-slate-400 bg-slate-50' : 'text-slate-800'}`}
                                                            />

                                                            {/* 男女トグル */}
                                                            <div className="flex space-x-0.5 shrink-0 w-12">
                                                                <button
                                                                    type="button"
                                                                    onClick={() => toggleMemberGender(index, 'M')}
                                                                    className={`w-6 py-1 text-xs font-bold rounded transition-all ${
                                                                        m.gender === 'M'
                                                                        ? 'bg-sky-500 text-white shadow-sm'
                                                                        : 'bg-white text-slate-400 border border-slate-200'
                                                                    }`}
                                                                >
                                                                    男
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    onClick={() => toggleMemberGender(index, 'F')}
                                                                    className={`w-6 py-1 text-xs font-bold rounded transition-all ${
                                                                        m.gender === 'F'
                                                                        ? 'bg-rose-500 text-white shadow-sm'
                                                                        : 'bg-white text-slate-400 border border-slate-200'
                                                                    }`}
                                                                >
                                                                    女
                                                                </button>
                                                            </div>

                                                            {/* レベルトグルボタン */}
                                                            <button
                                                                type="button"
                                                                onClick={() => toggleMemberLevel(index)}
                                                                className={`w-16 py-1 px-0.5 text-xs font-bold rounded border transition-all truncate text-center shrink-0 ${getLevelBadgeClass(m.level || '未設定')}`}
                                                                title="タップしてレベル変更"
                                                            >
                                                                {m.level || '未設定'}
                                                            </button>

                                                            {/* ゴミ箱ボタン */}
                                                            <button type="button" onClick={() => deleteMember(index)} className="w-6 p-1 text-slate-300 hover:text-rose-500 shrink-0 flex justify-center">
                                                                <TrashIcon />
                                                            </button>
                                                        </div>
                                                    ))}

                                                    <EmptyRowCreator onAddMember={handleAddMember} nextNumber={members.length + 1} getLevelBadgeClass={getLevelBadgeClass} />
                                                </div>
                                            </div>
                                        )}

                                        {}
                                        {activeTab === 'pair' && (
                                            <div className="space-y-3 py-1">
                                                <div className="text-xs font-bold text-slate-600 text-left pb-1 border-b border-slate-100">
                                                    固定または回避するペアを設定
                                                </div>

                                                <div className="space-y-1.5">
                                                    {pairRules.map((rule) => {
                                                        const p1Options = members.filter(m => m.id !== rule.p2);
                                                        const p2Options = members.filter(m => m.id !== rule.p1);

                                                        return (
                                                            <div key={rule.id} className="flex items-center space-x-1.5 p-1 border-b border-slate-100 text-xs">
                                                                <select
                                                                    value={rule.p1}
                                                                    onChange={(e) => handleUpdatePairRule(rule.id, 'p1', e.target.value)}
                                                                    className="flex-1 bg-white border border-slate-200 rounded px-1.5 py-1 font-bold text-slate-700 outline-none text-xs min-w-0"
                                                                >
                                                                    <option value="">選択</option>
                                                                    {p1Options.map(m => (
                                                                        <option key={m.id} value={m.id}>{m.name}</option>
                                                                    ))}
                                                                </select>

                                                                <span className="font-extrabold text-slate-400 text-xs shrink-0 px-0.5">＆</span>

                                                                <select
                                                                    value={rule.p2}
                                                                    onChange={(e) => handleUpdatePairRule(rule.id, 'p2', e.target.value)}
                                                                    disabled={!rule.p1}
                                                                    className="flex-1 bg-white border border-slate-200 rounded px-1.5 py-1 font-bold text-slate-700 outline-none text-xs min-w-0 disabled:bg-slate-100 disabled:text-slate-400"
                                                                >
                                                                    <option value="">選択</option>
                                                                    {p2Options.map(m => (
                                                                        <option key={m.id} value={m.id}>{m.name}</option>
                                                                    ))}
                                                                </select>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => {
                                                                        const nextType = rule.type === 'fix' ? 'avoid' : 'fix';
                                                                        handleUpdatePairRule(rule.id, 'type', nextType);
                                                                    }}
                                                                    className={`px-2 py-1 font-extrabold rounded text-xs transition-all shrink-0 ${
                                                                        rule.type === 'fix'
                                                                            ? 'bg-emerald-500 text-white shadow-sm'
                                                                            : 'bg-amber-500 text-white shadow-sm'
                                                                    }`}
                                                                >
                                                                    {rule.type === 'fix' ? '固定' : '回避'}
                                                                </button>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => {
                                                                        const levels = ['must', 'prefer', 'off'];
                                                                        const nextIndex = (levels.indexOf(rule.level) + 1) % levels.length;
                                                                        handleUpdatePairRule(rule.id, 'level', levels[nextIndex]);
                                                                    }}
                                                                    className={`px-2 py-1 font-extrabold rounded text-xs transition-all shrink-0 ${
                                                                        rule.level === 'must'
                                                                            ? 'bg-slate-800 text-white'
                                                                            : rule.level === 'prefer'
                                                                            ? 'bg-slate-500 text-white'
                                                                            : 'bg-slate-200 text-slate-400'
                                                                    }`}
                                                                >
                                                                    {rule.level === 'must' ? '必須' : rule.level === 'prefer' ? '優先' : 'オフ'}
                                                                </button>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => handleDeletePairRule(rule.id)}
                                                                    className="p-1 text-slate-300 hover:text-rose-500 shrink-0 transition-colors"
                                                                    title="削除"
                                                                >
                                                                    <TrashIcon />
                                                                </button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                <button
                                                    type="button"
                                                    onClick={handleAddPairRule}
                                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl border border-dashed border-slate-300 text-xs text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                                >
                                                    ＋ ペアを追加する
                                                </button>
                                            </div>
                                        )}

                                        {}
                                        {activeTab === 'settings' && (
                                            <div className="space-y-3 pt-1">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h3 className="text-xs font-bold text-slate-700">組み合わせの優先順位を設定</h3>
                                                    <button 
                                                        type="button"
                                                        onClick={() => {
                                                            setPriorityOrder(DEFAULT_PRIORITY);
                                                            setGenderMode(DEFAULT_GENDER_MODE);
                                                        }} 
                                                        className="text-xs text-emerald-600 font-bold underline hover:text-emerald-700"
                                                    >
                                                        初期設定に戻す
                                                    </button>
                                                </div>

                                                <div className="space-y-1.5">
                                                    {priorityOrder.map((key, index) => {
                                                        const isGenderItem = key === 'gender';

                                                        return (
                                                            <div key={key} className="flex items-center space-x-2">
                                                                <div className="w-6 h-6 my-0.5 rounded-full bg-slate-200 text-slate-600 font-extrabold text-xs flex items-center justify-center shrink-0">
                                                                    {index + 1}
                                                                </div>

                                                                <div className="flex-1 bg-slate-50 rounded-lg border border-slate-200 text-sm font-bold text-slate-700 shadow-sm overflow-hidden">
                                                                    {isGenderItem ? (
                                                                        <div>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => setIsGenderExpanded(!isGenderExpanded)}
                                                                                className="w-full py-1.5 px-3 flex items-center justify-between text-left focus:outline-none hover:bg-slate-100/60 transition-colors"
                                                                            >
                                                                                <span className="font-bold text-slate-700">{PRIORITY_LABELS[key]}</span>
                                                                                <div className="flex items-center space-x-1.5">
                                                                                    <span className="text-xs font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">
                                                                                        {getGenderBadgeText(genderMode)}
                                                                                    </span>
                                                                                    <span className="text-slate-700 text-base font-extrabold">
                                                                                        {isGenderExpanded ? '－' : '＋'}
                                                                                    </span>
                                                                                </div>
                                                                            </button>

                                                                            {isGenderExpanded && (
                                                                                <div className="px-3 pb-2.5 pt-1 border-t border-slate-200/60 bg-white/70 space-y-1 font-normal">
                                                                                    <label className="flex items-center space-x-2 py-0.5 cursor-pointer">
                                                                                        <input 
                                                                                            type="radio" 
                                                                                            name="accordionGenderMode"
                                                                                            checked={genderMode === 'mix'} 
                                                                                            onChange={() => setGenderMode('mix')} 
                                                                                            className="accent-emerald-500" 
                                                                                        />
                                                                                        <span className="text-sm font-bold text-slate-600">ミックスダブルス</span>
                                                                                    </label>
                                                                                    <label className="flex items-center space-x-2 py-0.5 cursor-pointer">
                                                                                        <input
