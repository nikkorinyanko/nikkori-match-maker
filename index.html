<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-slate-50">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HomeIcon = ({ className = "w-7.5 h-7.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className}>

                <polyline points="9 22 9 12 15 12 15 22" />

        );

        const SettingsIcon = ({ className = "w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        );

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                <line x1="10" x2="10" y1="11" y2="17" />
                <line x1="14" x2="14" y1="11" y2="17" />
            </svg>
        );

        const DEFAULT_GROUPS = [];

        const PRIORITY_LABELS = {
            count: '出場数均等',
            break: '連続休憩回避',
            consecutive: '連続出場回避',
            pair: '同一ペア回避',
            opponent: '同一相手回避',
            card: '同一カード回避',
            gender: '男女バランス',
            level: 'レベルバランス'
        };

        const DEFAULT_PRIORITY = ['count', 'break', 'consecutive', 'pair', 'opponent', 'card', 'gender', 'level'];
        const DEFAULT_GENDER_MODE = 'consider';
        const DEFAULT_LEVEL_MODE = 'consider';
        const LEVELS = ['未設定', '初級', '初中級', '中級', '中上級', '上級'];

        async function compressData(bytes) {
            if (typeof CompressionStream !== 'undefined') {
                try {
                    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                    const response = new Response(stream);
                    const buffer = await response.arrayBuffer();
                    return new Uint8Array(buffer);
                } catch(e) {
                    return bytes;
                }
            }
            return bytes;
        }

        async function decompressData(bytes) {
            if (typeof DecompressionStream !== 'undefined') {
                try {
                    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                    const response = new Response(stream);
                    const buffer = await response.arrayBuffer();
                    return new Uint8Array(buffer);
                } catch(e) {
                    return bytes;
                }
            }
            return bytes;
        }

        function uint8ToBase64Url(bytes) {
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const base64 = btoa(binary);
            return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64UrlToUint8(base64url) {
            let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) {
                base64 += '=';
            }
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function encodeShareData(presentMembers, matchList) {
            const encoder = new TextEncoder();
            const idMap = new Map();
            presentMembers.forEach((m, i) => idMap.set(m.id, i));

            const numMembers = presentMembers.length;
            const genderBytesCount = Math.ceil(numMembers / 8);

            const nameBytesList = presentMembers.map(m => encoder.encode(m.name || ''));

            let totalBytes = 1 + genderBytesCount;
            nameBytesList.forEach(nb => {
                totalBytes += 1 + nb.length;
            });
            totalBytes += matchList.length * 2;

            const buffer = new Uint8Array(totalBytes);
            let offset = 0;

            buffer[offset++] = numMembers;

            const genderOffset = offset;
            for (let i = 0; i < numMembers; i++) {
                const byteIdx = genderOffset + Math.floor(i / 8);
                const bitIdx = i % 8;
                if (presentMembers[i].gender === 'F') {
                    buffer[byteIdx] |= (1 << bitIdx);
                }
            }
            offset += genderBytesCount;

            nameBytesList.forEach(nb => {
                buffer[offset++] = nb.length;
                buffer.set(nb, offset);
                offset += nb.length;
            });

            matchList.forEach(m => {
                const p1 = idMap.has(m.t1[0]) ? idMap.get(m.t1[0]) : 0;
                const p2 = idMap.has(m.t1[1]) ? idMap.get(m.t1[1]) : 0;
                const p3 = idMap.has(m.t2[0]) ? idMap.get(m.t2[0]) : 0;
                const p4 = idMap.has(m.t2[1]) ? idMap.get(m.t2[1]) : 0;

                const val = ((p1 & 0xF) << 12) | ((p2 & 0xF) << 8) | ((p3 & 0xF) << 4) | (p4 & 0xF);
                buffer[offset++] = (val >> 8) & 0xFF;
                buffer[offset++] = val & 0xFF;
            });

            const compressed = await compressData(buffer);
            return uint8ToBase64Url(compressed);
        }

        async function decodeShareData(shareStr) {
            const compressed = base64UrlToUint8(shareStr);
            const buffer = await decompressData(compressed);
            const decoder = new TextDecoder();

            let offset = 0;
            const numMembers = buffer[offset++];
            if (numMembers < 1 || numMembers > 20) throw new Error("Invalid member count");

            const genderBytesCount = Math.ceil(numMembers / 8);
            const genderBytes = buffer.subarray(offset, offset + genderBytesCount);
            offset += genderBytesCount;

            const importedMembers = [];
            for (let i = 0; i < numMembers; i++) {
                const isFemale = (genderBytes[Math.floor(i / 8)] & (1 << (i % 8))) !== 0;
                const nameLen = buffer[offset++];
                const nameBytes = buffer.subarray(offset, offset + nameLen);
                offset += nameLen;
                const name = decoder.decode(nameBytes);

                importedMembers.push({
                    id: `member-share-${Date.now()}-${i}`,
                    name: name,
                    gender: isFemale ? 'F' : 'M',
                    level: '未設定',
                    present: true
                });
            }

            const importedMatchList = [];
            let matchIdx = 1;
            while (offset + 1 < buffer.length) {
                const val = (buffer[offset] << 8) | buffer[offset + 1];
                offset += 2;

                const idx1 = (val >> 12) & 0xF;
                const idx2 = (val >> 8) & 0xF;
                const idx3 = (val >> 4) & 0xF;
                const idx4 = val & 0xF;

                const p1 = importedMembers[idx1];
                const p2 = importedMembers[idx2];
                const p3 = importedMembers[idx3];
                const p4 = importedMembers[idx4];

                if (!p1 || !p2 || !p3 || !p4) continue;

                const players = [p1.id, p2.id, p3.id, p4.id];
                const absentees = importedMembers.filter(m => !players.includes(m.id)).map(m => m.id);

                importedMatchList.push({
                    id: `match-share-${matchIdx++}`,
                    players: players,
                    t1: [p1.id, p2.id],
                    t2: [p3.id, p4.id],
                    absentees: absentees
                });
            }

            return { importedMembers, importedMatchList };
        }

        const ensurePriorityList = (pList) => {
            if (!Array.isArray(pList)) return DEFAULT_PRIORITY;
            let list = pList.filter(p => Object.keys(PRIORITY_LABELS).includes(p));
            DEFAULT_PRIORITY.forEach(dp => {
                if (!list.includes(dp)) list.push(dp);
            });
            return list;
        };

        const normalizeGenderMode = (mode) => {
            if (['mix', 'balance', 'consider', 'none'].includes(mode)) return mode;
            return DEFAULT_GENDER_MODE;
        };

        const normalizeLevelMode = (mode) => {
            if (['prioritize', 'consider', 'none'].includes(mode)) return mode;
            return DEFAULT_LEVEL_MODE;
        };

        const getGenderBadgeText = (mode) => {
            switch (mode) {
                case 'mix': return 'ミックス';
                case 'balance': return '均等';
                case 'consider': return 'やや考慮';
                case 'none': return '考慮なし';
                default: return 'やや考慮';
            }
        };

        const cycleGenderMode = (current) => {
            const modes = ['consider', 'balance', 'mix', 'none'];
            const idx = modes.indexOf(current);
            return modes[(idx + 1) % modes.length];
        };

        const getLevelBadgeText = (mode) => {
            switch (mode) {
                case 'prioritize': return '重視';
                case 'consider': return 'やや考慮';
                case 'none': return '考慮なし';
                default: return 'やや考慮';
            }
        };

        const cycleLevelMode = (current) => {
            const modes = ['consider', 'prioritize', 'none'];
            const idx = modes.indexOf(current);
            return modes[(idx + 1) % modes.length];
        };

        const calculateBaseStats = (pastHistory, currentMembers) => {
            const presentMembers = currentMembers.filter(m => m.present);
            const baseStats = {};
            const rawStats = {};
            
            presentMembers.forEach(m => {
                rawStats[m.id] = { matchCount: 0, consecutiveRest: 0, consecutivePlay: 0 };
            });
            
            pastHistory.forEach(h => {
                presentMembers.forEach(m => {
                    if (h.players.includes(m.id)) {
                        rawStats[m.id].matchCount++;
                        rawStats[m.id].consecutivePlay++;
                        rawStats[m.id].consecutiveRest = 0;
                    } else if (h.absentees.includes(m.id)) {
                        rawStats[m.id].consecutiveRest++;
                        rawStats[m.id].consecutivePlay = 0;
                    } else {
                        rawStats[m.id].consecutivePlay = 0;
                        rawStats[m.id].consecutiveRest = 0; 
                    }
                });
            });

            const lastMatch = pastHistory[pastHistory.length - 1];
            let minMatchCount = Infinity;
            let maxConsecutiveRest = -1;
            
            const normalMembers = presentMembers.filter(m => 
                lastMatch ? (lastMatch.players.includes(m.id) || lastMatch.absentees.includes(m.id)) : true
            );

            if (normalMembers.length > 0) {
                normalMembers.forEach(m => {
                    if (rawStats[m.id].matchCount < minMatchCount) minMatchCount = rawStats[m.id].matchCount;
                    if (rawStats[m.id].consecutiveRest > maxConsecutiveRest) maxConsecutiveRest = rawStats[m.id].consecutiveRest;
                });
            } else {
                minMatchCount = 0;
                maxConsecutiveRest = 0;
            }
            
            presentMembers.forEach(m => {
                const isNew = !pastHistory.some(h => h.players.includes(m.id) || h.absentees.includes(m.id));
                const isReturn = !isNew && lastMatch && !lastMatch.players.includes(m.id) && !lastMatch.absentees.includes(m.id);

                if (isNew || isReturn) {
                    baseStats[m.id] = {
                        matchCount: Math.max(rawStats[m.id].matchCount, Math.max(0, minMatchCount)),
                        consecutivePlay: 0,
                        consecutiveRest: maxConsecutiveRest
                    };
                } else {
                    baseStats[m.id] = { ...rawStats[m.id] };
                }
            });

            return baseStats;
        };

        const getStats = (playerId, futureHistory, baseStatsMap) => {
            let stats = baseStatsMap && baseStatsMap[playerId] 
                ? { ...baseStatsMap[playerId] } 
                : { matchCount: 0, consecutiveRest: 0, consecutivePlay: 0 };

            for (const h of futureHistory) {
                if (h.players.includes(playerId)) {
                    stats.matchCount++;
                    stats.consecutivePlay++;
                    stats.consecutiveRest = 0;
                } else if (h.absentees.includes(playerId)) {
                    stats.consecutiveRest++;
                    stats.consecutivePlay = 0;
                }
            }
            return stats;
        };

        const calculatePenalty = (config, criterion, futureHistory, pastHistory, genderMode, levelMode, presentMembers, baseStatsMap, pairRules) => {
            const fullHistory = [...pastHistory, ...futureHistory];
            const courtIds = new Set(config.players.map(p => p.id));
            
            if (criterion === 'pair_rule_must' || criterion === 'pair_rule_prefer') {
                const targetLevel = criterion === 'pair_rule_must' ? 'must' : 'prefer';
                let score = 0;
                
                const t1 = config.t1.map(p => p.id);
                const t2 = config.t2.map(p => p.id);
                const players = config.players.map(p => p.id);
                
                const isPair = (pA, pB) => {
                    return (t1.includes(pA) && t1.includes(pB)) || (t2.includes(pA) && t2.includes(pB));
                };

                pairRules.forEach(rule => {
                    if (rule.level !== targetLevel) return;
                    
                    const p1 = rule.p1;
                    const p2 = rule.p2;
                    if (!p1 || !p2) return;
                    
                    if (rule.type === 'fix') {
                        if (players.includes(p1) && !isPair(p1, p2)) score += 10;
                        if (players.includes(p2) && !isPair(p1, p2)) score += 10;
                    } else if (rule.type === 'avoid') {
                        if (isPair(p1, p2)) score += 10;
                    }
                });
                return score;
            }

            if (criterion === 'count') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newCount = stats.matchCount + (courtIds.has(m.id) ? 1 : 0);
                    sum += Math.pow(newCount, 2);
                });
                return sum;
            }
            
            if (criterion === 'break') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newBreak = courtIds.has(m.id) ? 0 : stats.consecutiveRest + 1;
                    sum += Math.pow(newBreak, 2);
                });
                return sum;
            }
            
            if (criterion === 'consecutive') {
                let sum = 0;
                presentMembers.forEach(m => {
                    const stats = getStats(m.id, futureHistory, baseStatsMap);
                    const newCons = courtIds.has(m.id) ? stats.consecutivePlay + 1 : 0;
                    sum += Math.pow(newCons, 2);
                });
                return sum;
            }

            if (criterion === 'pair') {
                let sum = 0;
                const t1 = config.t1.map(p => p.id);
                const t2 = config.t2.map(p => p.id);
                
                const getPairCount = (pA, pB) => {
                    let count = 0;
                    fullHistory.forEach(m => {
                        if ((m.t1.includes(pA) && m.t1.includes(pB)) || 
                            (m.t2.includes(pA) && m.t2.includes(pB))) {
                            count++;
                        }
                    });
                    return count;
                };

                presentMembers.forEach(m => {
                    if (t1.includes(m.id)) {
                        const partner = t1[0] === m.id ? t1[1] : t1[0];
                        sum += Math.pow(getPairCount(m.id, partner) + 1, 2);
                    } else if (t2.includes(m.id)) {
                        const partner = t2[0] === m.id ? t2[1] : t2[0];
                        sum += Math.pow(getPairCount(m.id, partner) + 1, 2);
                    }
                });
                return sum;
            }

            if (criterion === 'opponent') {
                let sum = 0;
                const t1 = config.t1.map(p => p.id);
                const t2 = config.t2.map(p => p.id);

                const getOpponentCount = (pA, pB) => {
                    let count = 0;
                    fullHistory.forEach(m => {
                        if ((m.t1.includes(pA) && m.t2.includes(pB)) || 
                            (m.t2.includes(pA) && m.t1.includes(pB))) {
                            count++;
                        }
                    });
                    return count;
                };

                presentMembers.forEach(m => {
                    if (t1.includes(m.id)) {
                        sum += Math.pow(getOpponentCount(m.id, t2[0]) + 1, 2) + Math.pow(getOpponentCount(m.id, t2[1]) + 1, 2);
                    } else if (t2.includes(m.id)) {
                        sum += Math.pow(getOpponentCount(m.id, t1[0]) + 1, 2) + Math.pow(getOpponentCount(m.id, t1[1]) + 1, 2);
                    }
                });
                return sum;
            }

            if (criterion === 'card') {
                const t1 = config.t1.map(p => p.id).sort().join(',');
                const t2 = config.t2.map(p => p.id).sort().join(',');
                let count = 0;
                fullHistory.forEach(m => {
                    const ht1 = [...m.t1].sort().join(',');
                    const ht2 = [...m.t2].sort().join(',');
                    if ((t1 === ht1 && t2 === ht2) || (t1 === ht2 && t2 === ht1)) {
                        count++;
                    }
                });
                return count + 1;
            }
            
            if (criterion === 'gender') {
                if (genderMode === 'none') return 0;

                const t1Males = config.t1.filter(p => p.gender === "M").length;
                const t2Males = config.t2.filter(p => p.gender === "M").length;
                
                const isM1F1_vs_M1F1 = t1Males === 1 && t2Males === 1;
                const isM2F0_vs_M2F0 = t1Males === 2 && t2Males === 2;
                const isM0F2_vs_M0F2 = t1Males === 0 && t2Males === 0;
                const isM2F0_vs_M1F1 = (t1Males === 2 && t2Males === 1) || (t1Males === 1 && t2Males === 2);
                const isM0F2_vs_M1F1 = (t1Males === 0 && t2Males === 1) || (t1Males === 1 && t2Males === 0);
                const isM2F0_vs_M0F2 = (t1Males === 2 && t2Males === 0) || (t1Males === 0 && t2Males === 2);

                let score = 0;

                if (genderMode === 'mix') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 20;
                    else if (isM0F2_vs_M1F1) score = 20;
                    else if (isM2F0_vs_M2F0) score = 20;
                    else if (isM0F2_vs_M0F2) score = 20;
                    else if (isM2F0_vs_M0F2) score = 20;
                } else if (genderMode === 'balance') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 20;
                    else if (isM0F2_vs_M1F1) score = 20;
                    else if (isM2F0_vs_M2F0) score = 0;
                    else if (isM0F2_vs_M0F2) score = 0;
                    else if (isM2F0_vs_M0F2) score = 20;
                } else if (genderMode === 'consider') {
                    if (isM1F1_vs_M1F1) score = 0;
                    else if (isM2F0_vs_M1F1) score = 10;
                    else if (isM0F2_vs_M1F1) score = 10;
                    else if (isM2F0_vs_M2F0) score = 0;
                    else if (isM0F2_vs_M0F2) score = 0;
                    else if (isM2F0_vs_M0F2) score = 20;
                }
                
                return score;
            }

            if (criterion === 'level') {
                if (levelMode === 'none') return 0;

                const getLevelBaseVal = (lvl) => {
                    switch(lvl) {
                        case '初級': return 1;
                        case '初中級': return 2;
                        case '中級': return 3;
                        case '中上級': return 4;
                        case '上級': return 5;
                        default: return null;
                    }
                };

                const allMatchPlayers = [...config.t1, ...config.t2];
                const knownLevels = allMatchPlayers
                    .map(p => getLevelBaseVal(p.level))
                    .filter(v => v !== null);

                let calcPlayerLevel;

                if (knownLevels.length === 0) {
                    calcPlayerLevel = (p) => (p.gender === 'M' ? 2 : 1);
                } else {
                    const baseAvg = knownLevels.reduce((a, b) => a + b, 0) / knownLevels.length;
                    calcPlayerLevel = (p) => {
                        const base = getLevelBaseVal(p.level) ?? baseAvg;
                        return p.gender === 'M' ? base * 1.25 : base;
                    };
                }

                const sumT1 = config.t1.reduce((sum, p) => sum + calcPlayerLevel(p), 0) / config.t1.length;
                const sumT2 = config.t2.reduce((sum, p) => sum + calcPlayerLevel(p), 0) / config.t2.length;
                const levelDiff = Math.abs(sumT1 - sumT2);

                if (levelMode === 'prioritize') {
                    return levelDiff <= 0.5 ? 0 : 10;
                } else if (levelMode === 'consider') {
                    return levelDiff <= 1.0 ? 0 : 10;
                }

                return 0;
            }

            return 0;
        };

        function evaluateAndCreateNextMatch(presentMembers, futureHistory, pastHistory, priorityOrder, genderMode, levelMode, baseStatsMap, pairRules) {
            if (presentMembers.length < 4) return null;

            const N = presentMembers.length;
            const configurations = [];

            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    for (let k = j + 1; k < N; k++) {
                        for (let l = k + 1; l < N; l++) {
                            const p1 = presentMembers[i];
                            const p2 = presentMembers[j];
                            const p3 = presentMembers[k];
                            const p4 = presentMembers[l];

                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p2], t2: [p3, p4] });
                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p3], t2: [p2, p4] });
                            configurations.push({ players: [p1, p2, p3, p4], t1: [p1, p4], t2: [p2, p3] });
                        }
                    }
                }
            }
            
            const evaluationSteps = [];
            evaluationSteps.push('pair_rule_must');
            if (priorityOrder.length > 0) evaluationSteps.push(priorityOrder[0]);
            evaluationSteps.push('pair_rule_prefer');
            for (let i = 1; i < priorityOrder.length; i++) {
                evaluationSteps.push(priorityOrder[i]);
            }

            let candidates = [...configurations];

            for (const criterion of evaluationSteps) {
                const scores = candidates.map(config => calculatePenalty(config, criterion, futureHistory, pastHistory, genderMode, levelMode, presentMembers, baseStatsMap, pairRules));
                const minScore = Math.min(...scores);
                
                candidates = candidates.filter((_, idx) => scores[idx] === minScore);
                if (candidates.length === 1) break;
            }

            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            const chosenCourtIds = new Set(chosen.players.map(p => p.id));
            const chosenAbsentees = presentMembers.filter(m => !chosenCourtIds.has(m.id));

            return {
                id: `temp-${Date.now()}`,
                players: chosen.players.map(p => p.id),
                t1: chosen.t1.map(p => p.id),
                t2: chosen.t2.map(p => p.id),
                absentees: chosenAbsentees.map(p => p.id)
            };
        }

        function App() {
            const [page, setPage] = useState('top');
            const [groups, setGroups] = useState([]);
            const [activeGroupId, setActiveGroupId] = useState(null);
            
            const [groupName, setGroupName] = useState('');
            const [members, setMembers] = useState([]);
            const [sharedMembers, setSharedMembers] = useState([]);
            const [pairRules, setPairRules] = useState([]);
            
            const [activeTab, setActiveTab] = useState('members');

            const [priorityOrder, setPriorityOrder] = useState(DEFAULT_PRIORITY);
            const [genderMode, setGenderMode] = useState(DEFAULT_GENDER_MODE);
            const [levelMode, setLevelMode] = useState(DEFAULT_LEVEL_MODE);
            
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [matchList, setMatchList] = useState([]);
            const [matchPage, setMatchPage] = useState(0);
            
            const [toast, setToast] = useState({ show: false, message: "" });
            const [capturedImage, setCapturedImage] = useState(null);
            const [showImageModal, setShowImageModal] = useState(false);
            
            const [showContinueModal, setShowContinueModal] = useState(false);
            const [startMatchNumInput, setStartMatchNumInput] = useState("1");
            const [lastBoundaryIndex, setLastBoundaryIndex] = useState(0);

            const bottomRef = useRef(null);
            const tabContentRef = useRef(null);

            const prevMembersLength = useRef(members.length);
            const prevPairRulesLength = useRef(pairRules.length);

            const presentCount = members.filter(m => m.present).length;

            useEffect(() => {
                const stored = localStorage.getItem('nikkori_tennis_groups_v3');
                let loadedGroups = DEFAULT_GROUPS;
                if (stored) {
                    try {
                        loadedGroups = JSON.parse(stored);
                    } catch (e) {
                        loadedGroups = DEFAULT_GROUPS;
                    }
                }

                const hash = window.location.hash;
                if (hash.startsWith('#share:')) {
                    (async () => {
                        try {
                            const shareData = hash.substring(7);
                            const decoded = await decodeShareData(shareData);
                            const importedMembers = decoded.importedMembers;
                            const importedMatchList = decoded.importedMatchList;

                            const newGroupId = `group-share-${Date.now()}`;
                            const newGroup = {
                                id: newGroupId,
                                name: "共有された対戦表",
                                members: [],
                                sharedMembers: importedMembers,
                                pairRules: [],
                                settings: { priority: DEFAULT_PRIORITY, genderMode: DEFAULT_GENDER_MODE, levelMode: DEFAULT_LEVEL_MODE },
                                matchList: importedMatchList
                            };
                            
                            loadedGroups = [...loadedGroups, newGroup];
                            localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(loadedGroups));
                            
                            setGroups(loadedGroups);
                            setActiveGroupId(newGroupId);
                            setGroupName("共有された対戦表");
                            setMembers([]);
                            setSharedMembers(importedMembers);
                            setPairRules([]);
                            setMatchList(importedMatchList);
                            setPriorityOrder(newGroup.settings.priority);
                            setGenderMode(normalizeGenderMode(newGroup.settings.genderMode));
                            setLevelMode(normalizeLevelMode(newGroup.settings.levelMode));
                            setActiveTab('members');
                            setPage('match');
                            setMatchPage(0);
                            
                            window.history.replaceState("", document.title, window.location.pathname + window.location.search);
                        } catch(e) {
                            console.error("URL解析エラー", e);
                        }
                    })();
                    return;
                }

                setGroups(loadedGroups);
            }, []);

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [page]);

            useEffect(() => {
                if (members.length > prevMembersLength.current) {
                    setTimeout(() => {
                        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }
                prevMembersLength.current = members.length;
            }, [members.length]);

            useEffect(() => {
                if (pairRules.length > prevPairRulesLength.current) {
                    setTimeout(() => {
                        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }
                prevPairRulesLength.current = pairRules.length;
            }, [pairRules.length]);

            const triggerToast = (msg) => {
                setToast({ show: true, message: msg });
                setTimeout(() => setToast({ show: false, message: "" }), 2500);
            };

            const handleGoHome = () => {
                setPage('top');
                setActiveGroupId(null);
                setDeleteConfirmId(null);
            };
            
            const handleBackToGroup = () => {
                setPage('group');
            };

            const handleCreateNewGroup = () => {
                const newId = `group-${Date.now()}`;
                const newGroup = {
                    id: newId,
                    name: "",
                    members: [],
                    sharedMembers: [],
                    pairRules: [],
                    settings: { priority: DEFAULT_PRIORITY, genderMode: DEFAULT_GENDER_MODE, levelMode: DEFAULT_LEVEL_MODE },
                    matchList: []
                };
                const updated = [...groups, newGroup];
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
                
                setActiveGroupId(newId);
                setGroupName("");
                setMembers([]);
                setSharedMembers([]);
                setPairRules([]);
                setMatchList([]);
                setPriorityOrder(newGroup.settings.priority);
                setGenderMode(normalizeGenderMode(newGroup.settings.genderMode));
                setLevelMode(normalizeLevelMode(newGroup.settings.levelMode));
                setActiveTab('members');
                setDeleteConfirmId(null);
                setPage('group');
            };

            const handleSelectGroup = (gId) => {
                const target = groups.find(g => g.id === gId);
                if (!target) return;
                setActiveGroupId(gId);
                setGroupName(target.name);
                setMembers(target.members || []);
                setSharedMembers(target.sharedMembers || []);
                setPairRules(target.pairRules || []);
                setMatchList(target.matchList || []);
                setPriorityOrder(ensurePriorityList(target.settings?.priority));
                setGenderMode(normalizeGenderMode(target.settings?.genderMode));
                setLevelMode(normalizeLevelMode(target.settings?.levelMode));
                setActiveTab('members');
                setDeleteConfirmId(null);
                setPage('group');
            };

            const handleMoveGroup = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= groups.length) return;
                const updated = [...groups];
                const temp = updated[index];
                updated[index] = updated[targetIndex];
                updated[targetIndex] = temp;
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
            };

            const handleSaveGroup = () => {
                const resolvedName = groupName.trim() || "（名称未設定のグループ）";
                const cleanMembers = members.filter(m => m.name.trim() !== "");

                const validMemberIds = new Set(cleanMembers.map(m => m.id));
                const cleanPairRules = pairRules.filter(r => 
                    r.p1 && r.p2 && validMemberIds.has(r.p1) && validMemberIds.has(r.p2)
                );

                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { 
                            ...g, 
                            name: resolvedName, 
                            members: cleanMembers, 
                            sharedMembers: sharedMembers,
                            pairRules: cleanPairRules,
                            settings: { priority: priorityOrder, genderMode: genderMode, levelMode: levelMode },
                            matchList: matchList 
                        };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                setMembers(cleanMembers);
                setPairRules(cleanPairRules);
                setGroupName(resolvedName);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));
                triggerToast("💾 保存しました");
            };

            const handleDeleteGroupById = (gId) => {
                const updated = groups.filter(g => g.id !== gId);
                setGroups(updated);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updated));
                setDeleteConfirmId(null);
                triggerToast("🗑️ グループを削除しました");
                if (activeGroupId === gId) {
                    setPage('top');
                    setActiveGroupId(null);
                }
            };

            const updateMemberName = (index, newName) => {
                if (newName.length > 4) return;
                const isDuplicate = members.some((m, i) => i !== index && m.name === newName && newName !== "");
                if (isDuplicate) {
                    triggerToast("⚠️ 同じメンバー名は使えません");
                    return; 
                }
                const copy = [...members];
                copy[index].name = newName;
                setMembers(copy);
            };

            const toggleMemberGender = (index, gender) => {
                const copy = [...members];
                copy[index].gender = gender;
                setMembers(copy);
            };

            const toggleMemberLevel = (index) => {
                const copy = [...members];
                const currentLevel = copy[index].level || '未設定';
                const nextIdx = (LEVELS.indexOf(currentLevel) + 1) % LEVELS.length;
                copy[index].level = LEVELS[nextIdx];
                setMembers(copy);
            };

            const toggleMemberPresence = (index) => {
                const copy = [...members];
                if (!copy[index].present && presentCount >= 12) {
                    triggerToast("⚠️ 参加者は最大12名までです");
                    return;
                }
                copy[index].present = !copy[index].present;
                setMembers(copy);
            };

            const deleteMember = (index) => {
                const deletedMemberId = members[index].id;
                const copy = [...members];
                copy.splice(index, 1);
                setMembers(copy);

                setPairRules(prev => prev.filter(r => r.p1 !== deletedMemberId && r.p2 !== deletedMemberId));
            };

            const handleAddMember = (name, gender, level = '未設定') => {
                if (members.some(m => m.name === name)) {
                    triggerToast("⚠️ 同じメンバー名は使えません");
                    return;
                }
                const isPresent = presentCount < 12;
                const newM = {
                    id: `member-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                    name: name.slice(0, 4),
                    gender: gender,
                    level: level,
                    present: isPresent
                };
                setMembers([...members, newM]);
                if (!isPresent) triggerToast("⚠️ 最大参加人数の12名に達したため不参加で登録しました");
            };

            const validatePairRule = (targetRuleId, newP1, newP2, newType, newLevel) => {
                if (!newP1 || !newP2) return true;

                if (newP1 === newP2) {
                    triggerToast("⚠️ 同じメンバー同士は選択できません");
                    return false;
                }

                for (const rule of pairRules) {
                    if (rule.id === targetRuleId) continue;
                    if (!rule.p1 || !rule.p2) continue;

                    const isSamePair = (rule.p1 === newP1 && rule.p2 === newP2) || (rule.p1 === newP2 && rule.p2 === newP1);

                    if (isSamePair) {
                        triggerToast("⚠️ 同じペアの設定が既に存在します");
                        return false;
                    }
                }

                if (newType === 'fix' && newLevel !== 'off') {
                    for (const rule of pairRules) {
                        if (rule.id === targetRuleId) continue;
                        if (!rule.p1 || !rule.p2 || rule.type !== 'fix' || rule.level === 'off') continue;

                        if (rule.p1 === newP1 || rule.p2 === newP1) {
                            const partnerId = rule.p1 === newP1 ? rule.p2 : rule.p1;
                            const partner = members.find(m => m.id === partnerId);
                            const currentM = members.find(m => m.id === newP1);
                            triggerToast(`⚠️ ${currentM?.name || ''}さんはすでに${partner?.name || ''}さんと固定ペアになっています`);
                            return false;
                        }

                        if (rule.p1 === newP2 || rule.p2 === newP2) {
                            const partnerId = rule.p1 === newP2 ? rule.p2 : rule.p1;
                            const partner = members.find(m => m.id === newP2);
                            const currentM = members.find(m => m.id === newP2);
                            triggerToast(`⚠️ ${currentM?.name || ''}さんはすでに${partner?.name || ''}さんと固定ペアになっています`);
                            return false;
                        }
                    }
                }

                return true;
            };

            const handleAddPairRule = () => {
                const newRule = {
                    id: `pair-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                    p1: '',
                    p2: '',
                    type: 'fix',
                    level: 'must'
                };
                setPairRules([...pairRules, newRule]);
            };

            const handleUpdatePairRule = (id, field, value) => {
                const rule = pairRules.find(r => r.id === id);
                if (!rule) return;

                let nextP1 = field === 'p1' ? value : rule.p1;
                let nextP2 = field === 'p2' ? value : rule.p2;
                let nextType = field === 'type' ? value : rule.type;
                let nextLevel = field === 'level' ? value : rule.level;

                if (!validatePairRule(id, nextP1, nextP2, nextType, nextLevel)) {
                    return;
                }

                setPairRules(pairRules.map(r => {
                    if (r.id === id) {
                        return { ...r, [field]: value };
                    }
                    return r;
                }));
            };

            const handleDeletePairRule = (id) => {
                setPairRules(pairRules.filter(r => r.id !== id));
            };

            const handleCreateMatchTable = () => {
                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);

                if (activeAttendees.length < 4) {
                    triggerToast("⚠️ 試合を行うには参加者が最低4人必要です");
                    return;
                }

                handleSaveGroup();

                const generated = [];
                const baseStatsMap = {}; 
                activeAttendees.forEach(m => baseStatsMap[m.id] = {matchCount:0, consecutivePlay:0, consecutiveRest:0});

                for (let i = 0; i < 10; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, generated, [], priorityOrder, genderMode, levelMode, baseStatsMap, pairRules);
                    if (nextMatch) generated.push(nextMatch);
                    else break;
                }

                const finalizedList = generated.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);
                setLastBoundaryIndex(0);
                
                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                setMatchPage(0);
                setPage('match');
            };

            const handleOpenContinueModal = () => {
                setStartMatchNumInput("1");
                setShowContinueModal(true);
            };

            const handleExecuteContinue = () => {
                const startNum = parseInt(startMatchNumInput, 10);
                if (isNaN(startNum) || startNum < 1 || startNum > matchList.length + 1) {
                    triggerToast("⚠️ 正しい開始試合数を入力してください");
                    return;
                }

                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);

                if (activeAttendees.length < 4) {
                    triggerToast("⚠️ 試合を行うには参加者が最低4人必要です");
                    setShowContinueModal(false);
                    return;
                }

                handleSaveGroup();

                const pastHistory = matchList.slice(0, startNum - 1);
                const baseStatsMap = calculateBaseStats(pastHistory, cleanMembers);

                const targetTotal = Math.ceil(startNum / 10) * 10;
                const matchesToGenerate = targetTotal - pastHistory.length;

                const generated = [];
                for (let i = 0; i < matchesToGenerate; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, generated, pastHistory, priorityOrder, genderMode, levelMode, baseStatsMap, pairRules);
                    if (nextMatch) generated.push(nextMatch);
                    else break;
                }

                const newMatchList = [...pastHistory, ...generated];
                
                const finalizedList = newMatchList.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);

                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                const targetPage = Math.floor((startNum - 1) / 10);
                setMatchPage(targetPage);
                
                setPage('match');
                setShowContinueModal(false);
            };

            const handleNextPageOrGenerate = () => {
                const targetPageIndex = matchPage + 1;
                const requiredMatchesCount = (targetPageIndex + 1) * 10;

                if (matchList.length >= requiredMatchesCount) {
                    setMatchPage(targetPageIndex);
                    return;
                }

                const cleanMembers = members.filter(m => m.name.trim() !== "");
                const activeAttendees = cleanMembers.filter(m => m.present);
                if (activeAttendees.length < 4) {
                    triggerToast("⚠️ 試合を行うには参加者が最低4人必要です");
                    return;
                }

                const countToGenerate = requiredMatchesCount - matchList.length;
                const nextMatches = [];
                const baseStatsMap = calculateBaseStats(matchList, cleanMembers);

                for (let i = 0; i < countToGenerate; i++) {
                    const nextMatch = evaluateAndCreateNextMatch(activeAttendees, nextMatches, matchList, priorityOrder, genderMode, levelMode, baseStatsMap, pairRules);
                    if (nextMatch) nextMatches.push(nextMatch);
                    else break;
                }

                if (nextMatches.length === 0) {
                    triggerToast("⚠️ これ以上組み合わせを作れません");
                    return;
                }
                
                const newMatchList = [...matchList, ...nextMatches];
                const finalizedList = newMatchList.map((m, idx) => ({
                    ...m,
                    id: `match-${idx + 1}`
                }));

                setMatchList(finalizedList);
                
                const updatedGroups = groups.map(g => {
                    if (g.id === activeGroupId) {
                        return { ...g, matchList: finalizedList };
                    }
                    return g;
                });
                setGroups(updatedGroups);
                localStorage.setItem('nikkori_tennis_groups_v3', JSON.stringify(updatedGroups));

                setMatchPage(targetPageIndex);
            };

            const handleShareUrl = async () => {
                const presentMembers = members.length > 0 ? members.filter(m => m.present) : sharedMembers;
                if (presentMembers.length === 0 || matchList.length === 0) {
                    triggerToast("⚠️ 共有する対戦表がありません");
                    return;
                }

                try {
                    const shareData = await encodeShareData(presentMembers, matchList);
                    const shareUrl = `${window.location.origin}${window.location.pathname}#share:${shareData}`;
                    
                    let copied = false;
                    
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        try {
                            await navigator.clipboard.writeText(shareUrl);
                            copied = true;
                        } catch (err) {
                            console.warn("writeText failed, using fallback:", err);
                        }
                    }
                    
                    if (!copied) {
                        const textArea = document.createElement("textarea");
                        textArea.value = shareUrl;
                        textArea.style.fontSize = "12pt";
                        textArea.style.border = "0";
                        textArea.style.padding = "0";
                        textArea.style.margin = "0";
                        textArea.style.position = "fixed";
                        textArea.style.left = "-9999px";
                        textArea.style.top = (window.pageYOffset || document.documentElement.scrollTop) + "px";
                        document.body.appendChild(textArea);
                        
                        textArea.focus();
                        textArea.select();
                        textArea.setSelectionRange(0, 999999);
                        
                        copied = document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }

                    if (copied) {
                        triggerToast("✅ URLをコピーしました");
                    } else {
                        triggerToast("⚠️ URLのコピーに失敗しました");
                    }
                } catch (err) {
                    console.error("Share error:", err);
                    triggerToast("⚠️ URLの生成に失敗しました");
                }
            };

            const handleCopyImage = async () => {
                const element = document.getElementById('match-table-capture-area');
                if (!element) return;
                
                triggerToast("⏳ コピー中...");
                
                try {
                    const canvas = await html2canvas(element, {
                        scale: 2, 
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        logging: false,
                        onclone: (clonedDoc) => {
                            const targetElements = clonedDoc.querySelectorAll('.capture-safe-text');
                            targetElements.forEach(el => {
                                el.style.position = 'relative';
                                const text = el.textContent.trim();
                                
                                if (text.toLowerCase() === 'vs') {
                                    el.style.top = '-10px';
                                } else if (el.classList.contains('w-[48%]')) {
                                    el.style.top = '-2px';
                                } else if (el.parentElement && el.parentElement.classList.contains('w-[48%]')) {
                                    el.style.top = '-6px';
                                } else {
                                    el.style.top = '-8px';
                                }
                            });
                        }
                    });

                    canvas.toBlob(async (blob) => {
                        if (!blob) {
                            triggerToast("⚠️ 画像の生成に失敗しました");
                            return;
                        }

                        let imageCopied = false;
                        if (navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined') {
                            try {
                                const item = new ClipboardItem({ "image/png": blob });
                                await navigator.clipboard.write([item]);
                                imageCopied = true;
                                triggerToast("✅ コピー完了");
                            } catch (err) {
                                console.error("Clipboard API write error:", err);
                            }
                        }

                        if (!imageCopied) {
                            const imgData = URL.createObjectURL(blob);
                            setCapturedImage(imgData);
                            setShowImageModal(true);
                            triggerToast("⚠️ コピーに失敗しました。画像を手動で保存してください。");
                        }
                    }, 'image/png');
                } catch (e) {
                    console.error(e);
                    triggerToast("⚠️ 画像の生成に失敗しました");
                }
            };

            const movePriority = (index, direction) => {
                const newOrder = [...priorityOrder];
                const target = index + direction;
                if (target < 0 || target >= newOrder.length) return;
                [newOrder[index], newOrder[target]] = [newOrder[target], newOrder[index]];
                setPriorityOrder(newOrder);
            };

            const getMemberName = (id) => {
                const m = members.find(p => p.id === id) || sharedMembers.find(p => p.id === id);
                if (!m) return { name: "??", isMale: true };
                return { name: m.name, isMale: m.gender === "M" };
            };

            const NameSpan = ({ player }) => {
                const len = player.name.length;
                const textSize = len >= 4 ? 'text-xs' : 'text-sm';
                const bgColor = player.isMale ? 'bg-sky-50 text-sky-700 border-sky-100' : 'bg-rose-50 text-rose-700 border-rose-100';
                
                return (
                    <div className={`w-[48%] h-[18px] flex items-center justify-center font-bold rounded border ${bgColor} ${textSize} leading-none py-0 px-0.5 capture-safe-text`}>
                        <span className="whitespace-nowrap overflow-visible capture-safe-text">{player.name}</span>
                    </div>
                );
            };

            const getLevelBadgeClass = (level) => {
                switch (level) {
                    case '初級':
                        return 'bg-lime-100 text-lime-800 border-lime-300 hover:bg-lime-200';
                    case '初中級':
                        return 'bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200';
                    case '中級':

                                        type="button"
                                        onClick={() => setMatchPage(p => Math.max(0, p - 1))}
                                        disabled={matchPage === 0}
                                        className={`text-sm font-bold py-1.5 transition-colors ${
                                            matchPage > 0 
                                            ? 'text-slate-600 hover:text-slate-800 cursor-pointer active:scale-95' 
                                            : 'text-slate-300 cursor-not-allowed'
                                        }`}
                                    >
                                        ← 前の10試合
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={handleNextPageOrGenerate}
                                        className="text-sm font-bold py-1.5 text-slate-600 hover:text-slate-800 transition-colors active:scale-95 cursor-pointer"
                                    >
                                        次の10試合 →
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-[64px] left-0 right-0 z-30 bg-slate-50/90 backdrop-blur-sm p-3">
                        <div className="max-w-md w-full mx-auto px-1">
                            {page === 'top' && (
                                <button
                                    type="button"
                                    onClick={handleCreateNewGroup}
                                    className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-base py-3.5 px-4 rounded-xl shadow-md text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                >
                                    新規グループを作成する
                                </button>
                            )}

                            {page === 'group' && (
                                <div className="flex space-x-2">
                                    <button
                                        type="button"
                                        onClick={handleCreateMatchTable}
                                        className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold text-base py-3.5 px-2 rounded-xl shadow-md text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                    >
                                        対戦表を新規作成する
                                    </button>
                                    
                                    {matchList.length > 0 && (
                                        <button
                                            type="button"
                                            onClick={handleOpenContinueModal}
                                            className="w-24 bg-slate-500 hover:bg-slate-600 text-white font-bold text-base py-3.5 px-1 rounded-xl shadow-md text-center flex items-center justify-center transition-all active:scale-[0.98] leading-none shrink-0"
                                        >
                                            続きから
                                        </button>
                                    )}
                                </div>
                            )}

                            {page === 'match' && (
                                <div className="flex space-x-2">
                                    <button
                                        type="button"
                                        onClick={handleShareUrl}
                                        className="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold text-base py-3.5 px-1 rounded-xl shadow-md text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                    >
                                        URLで共有する
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleCopyImage}
                                        className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold text-base py-3.5 px-1 rounded-xl shadow-md text-center flex items-center justify-center transition-all active:scale-[0.98]"
                                    >
                                        画像をコピーする
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-50 h-[60px] flex items-start pt-1 justify-between px-6">
                        <div className="max-w-md w-full mx-auto flex items-start justify-between">
                            {/* 左側：設定ボタン */}
                            <div className="w-28 flex justify-start">
                                {page === 'match' && (
                                    <button
                                        type="button"
                                        onClick={handleBackToGroup}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base py-1 px-5 rounded-full shadow-md flex items-center space-x-1 transition-all active:scale-95 active:shadow-sm"
                                    >
                                        <span className="font-black text-sm">❮</span>
                                        <span>設定</span>
                                    </button>
                                )}
                            </div>

                            {/* 中央：全画面共通 HOMEボタン */}
                            <div className="flex justify-center">
                                <button
                                    type="button"
                                    onClick={handleGoHome}
                                    className="flex flex-col items-center justify-center py-0 px-3 text-emerald-600 hover:text-emerald-700 transition-all active:scale-90"
                                >
                                    <HomeIcon className="w-[30px] h-[30px] -mt-[3px] transition-transform" />
                                    <span className="text-[10px] font-extrabold leading-tight mt-0.5 tracking-wider">HOME</span>
                                </button>
                            </div>

                            {/* 右側：対戦表ボタン */}
                            <div className="w-28 flex justify-end">
                                {page === 'group' && (
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (matchList.length > 0) {
                                                setPage('match');
                                            } else {
                                                handleCreateMatchTable();
                                            }
                                        }}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base py-1 px-4 rounded-full shadow-md flex items-center space-x-1 transition-all active:scale-95 active:shadow-sm"
                                    >
                                        <span>対戦表</span>
                                        <span className="font-black text-sm">❯</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </footer>

                    {showContinueModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-[200px] w-full p-4 space-y-3 shadow-2xl relative">
                                <h3 className="font-extrabold text-sm text-slate-800 text-center">
                                    何試合目から変更しますか。
                                </h3>
                                <div className="flex items-center justify-center space-x-1">
                                    <input 
                                        type="number" 
                                        min="1"
                                        max={matchList.length + 1}
                                        value={startMatchNumInput}
                                        onChange={(e) => setStartMatchNumInput(e.target.value)}
                                        className="w-16 bg-slate-50 border border-slate-200 focus:border-emerald-500 rounded-lg px-2 py-1 outline-none text-center font-bold text-slate-800"
                                    />
                                    <span className="text-xs font-bold text-slate-600">試合目</span>
                                </div>
                                <div className="flex space-x-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowContinueModal(false)}
                                        className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 text-sm rounded-xl transition-all shadow-sm"
                                    >
                                        取消
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setLastBoundaryIndex(parseInt(startMatchNumInput, 10) - 1);
                                            handleExecuteContinue();
                                        }}
                                        className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 text-sm rounded-xl transition-all shadow-sm"
                                    >
                                        OK
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showImageModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                                <div className="text-center space-y-1">
                                    <h3 className="font-extrabold text-lg text-slate-800">
                                        画像が生成されました
                                    </h3>
                                    <p className="text-xs text-slate-500 leading-normal">
                                        ブラウザの制限によりクリップボードへ直接コピーできませんでした。画像を長押しして保存してください。
                                    </p>
                                </div>

                                <div className="border border-slate-200 rounded-xl overflow-hidden shadow-inner max-h-[380px] overflow-y-auto">
                                    <img src={capturedImage} alt="Match Schedule" className="w-full h-auto block" />
                                </div>

                                <div className="flex justify-center">
                                    <button
                                        type="button"
                                        onClick={() => setShowImageModal(false)}
                                        className="text-slate-600 hover:text-slate-800 font-bold py-2 px-6 text-xs transition-all w-full"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed bottom-28 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white font-bold text-xs py-2 px-5 rounded-full shadow-lg whitespace-nowrap">
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        }

        function EmptyRowCreator({ onAddMember, nextNumber, getLevelBadgeClass }) {
            const [name, setName] = useState("");
            const [level, setLevel] = useState("未設定");
            
            const handleTriggerAdd = (gender) => {
                const finalName = name.trim() || `名前${nextNumber}`;
                onAddMember(finalName, gender, level);
                setName(""); 
            };

            const toggleLevel = () => {
                const nextIdx = (LEVELS.indexOf(level) + 1) % LEVELS.length;
                setLevel(LEVELS[nextIdx]);
            };

            return (
                <div className="flex items-center space-x-1.5 p-1">
                    <div className="w-11 shrink-0"></div>
                    
                    <input
                        type="text"
                        value={name}
                        onChange={(e) => { if (e.target.value.length <= 4) setName(e.target.value); }}
                        placeholder={`名前${nextNumber}`}
                        maxLength={4}
                        className="flex-1 min-w-0 bg-white border border-slate-200 focus:border-emerald-500 rounded px-2 py-1 outline-none text-xs font-bold text-slate-800 placeholder:text-slate-300 placeholder:font-normal shrink-0"
                    />

                    <div className="flex space-x-0.5 shrink-0 w-12">
                        <button
                            type="button"
                            onClick={() => handleTriggerAdd('M')}
                            className="w-6 py-1 text-xs font-bold rounded border border-sky-200 text-sky-500 hover:bg-sky-50 transition-all bg-white"
                        >
                            男
                        </button>
                        <button
                            type="button"
                            onClick={() => handleTriggerAdd('F')}
                            className="w-6 py-1 text-xs font-bold rounded border border-rose-200 text-rose-500 hover:bg-rose-50 transition-all bg-white"
                        >
                            女
                        </button>
                    </div>

                    <button
                        type="button"
                        onClick={toggleLevel}
                        className={`w-16 py-1 px-0.5 text-xs font-bold rounded border transition-all truncate text-center shrink-0 ${getLevelBadgeClass(level)}`}
                        title="タップしてレベル変更"
                    >
                        {level}
                    </button>

                    <div className="w-6 shrink-0"></div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
